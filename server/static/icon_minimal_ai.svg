<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" width="512" height="512">
  <defs>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background Circle (Light Fill) -->
  <circle cx="12" cy="12" r="10" fill="#eff6ff" />
  
  <!-- Outer Ring -->
  <circle cx="12" cy="12" r="10" stroke="url(#gBlue)" stroke-width="2" />

  <!-- Neural Network Connections -->
  <!-- Subtle lines connecting to the edge -->
  <g stroke="url(#gBlue)" stroke-width="0.5" opacity="0.3">
    <!-- Top connections -->
    <line x1="12" y1="8" x2="12" y2="4" />
    <line x1="10" y1="9" x2="7" y2="5" />
    <line x1="14" y1="9" x2="17" y2="5" />
    
    <!-- Bottom connections -->
    <line x1="9" y1="15" x2="6" y2="18" />
    <line x1="15" y1="15" x2="18" y2="18" />
    <line x1="12" y1="16" x2="12" y2="20" />
    
    <!-- Side connections -->
    <line x1="8" y1="12" x2="4" y2="12" />
    <line x1="16" y1="12" x2="20" y2="12" />
  </g>

  <!-- Neural Nodes (Subtle dots) -->
  <!-- Reduced opacity and size to make them less obvious -->
  <g fill="url(#gBlue)" opacity="0.4">
    <circle cx="12" cy="4" r="0.8" />
    <circle cx="7" cy="5" r="0.6" />
    <circle cx="17" cy="5" r="0.6" />
    <circle cx="6" cy="18" r="0.6" />
    <circle cx="18" cy="18" r="0.6" />
    <circle cx="12" cy="20" r="0.8" />
    <circle cx="4" cy="12" r="0.6" />
    <circle cx="20" cy="12" r="0.6" />
  </g>

  <!-- Central Text "AI" -->
  <text x="12" y="16" font-family="Arial, sans-serif" font-weight="900" font-size="10" text-anchor="middle" fill="url(#gBlue)">AI</text>
  
</svg>