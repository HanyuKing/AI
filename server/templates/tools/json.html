{% extends "base.html" %}

{% block title %}JSON 工具 - MediaToolbox{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto mt-4">
    <div class="bg-white shadow-lg rounded-lg overflow-hidden flex flex-col" style="height: calc(100vh - 140px);">
        <!-- Header -->
        <div class="bg-gray-100 px-4 py-2 border-b border-gray-200">
            <h2 class="text-xl font-bold text-gray-800">JSON 工具</h2>
        </div>

        <!-- Editor Area -->
        <div class="flex-grow flex flex-col md:flex-row overflow-hidden">
            <!-- Input -->
            <div class="w-full md:w-1/2 p-0 flex flex-col border-r border-gray-200">
                <div class="bg-gray-50 px-4 py-2 border-b border-gray-200 flex items-center justify-between">
                    <span class="text-sm font-semibold text-gray-700">输入</span>
                    <div class="flex space-x-2 flex-wrap">
                        <button onclick="formatInput()" class="px-3 py-1 bg-blue-600 border border-transparent rounded text-xs font-medium text-white hover:bg-blue-700 transition">
                            格式化
                        </button>
                        <button onclick="compressInput()" class="px-3 py-1 bg-white border border-gray-300 rounded text-xs font-medium hover:bg-gray-50 text-gray-700 transition">
                            压缩
                        </button>
                        <button onclick="escapeJson()" class="px-3 py-1 bg-purple-600 border border-transparent rounded text-xs font-medium text-white hover:bg-purple-700 transition">
                            转译
                        </button>
                        <button onclick="unescapeJson()" class="px-3 py-1 bg-purple-100 border border-purple-300 rounded text-xs font-medium text-purple-700 hover:bg-purple-200 transition">
                            去转译
                        </button>
                        <button onclick="clearAll()" class="px-3 py-1 bg-red-50 border border-red-200 rounded text-xs font-medium text-red-600 hover:bg-red-100 transition">
                            清空
                        </button>
                    </div>
                </div>
                <div class="flex-grow flex overflow-hidden relative">
                    <div id="inputLineNumbers" class="bg-gray-50 text-right text-gray-400 text-sm font-mono py-4 pr-3 pl-2 border-r border-gray-200 select-none overflow-hidden" style="min-width: 50px; line-height: 1.5; white-space: pre;">1</div>
                    <textarea id="inputJson" class="flex-grow w-full py-4 pl-4 pr-4 font-mono text-sm focus:outline-none resize-none overflow-auto" placeholder="在此粘贴 JSON..." style="line-height: 1.5;"></textarea>
                </div>
            </div>
            
            <!-- Output -->
            <div class="w-full md:w-1/2 p-0 flex flex-col bg-white">
                <div class="bg-gray-50 px-4 py-2 border-b border-gray-200 flex items-center justify-between">
                    <span class="text-sm font-semibold text-gray-700">树形视图</span>
                    <div class="flex space-x-2 items-center">
                        <span id="statusMsg" class="text-green-600 text-xs hidden mr-2">处理成功</span>
                        <button onclick="expandAll()" class="px-3 py-1 bg-white border border-gray-300 rounded text-xs font-medium hover:bg-gray-50 text-gray-700 transition">
                            全部展开
                        </button>
                        <button onclick="collapseAll()" class="px-3 py-1 bg-white border border-gray-300 rounded text-xs font-medium hover:bg-gray-50 text-gray-700 transition">
                            全部折叠
                        </button>
                        <button onclick="copyFormattedJson()" class="px-3 py-1 bg-green-600 border border-transparent rounded text-xs font-medium text-white hover:bg-green-700 transition">
                            复制JSON
                        </button>
                    </div>
                </div>
                <div id="outputJson" class="flex-grow w-full py-4 overflow-auto text-sm bg-white" style="font-family: 'Consolas', 'Monaco', 'Menlo', 'Ubuntu Mono', 'Courier New', monospace;"></div>
            </div>
        </div>
    </div>
</div>

<style>
.json-tree {
    line-height: 1.5;
    font-size: 14px;
    color: #333;
    display: flex;
    flex-direction: column;
}

.json-line {
    padding: 0;
    position: relative;
    transition: background-color 0.1s;
    white-space: nowrap;
    display: flex;
    min-height: 21px;
}

.json-line:hover {
    background-color: #f5f5f5;
}

.json-line-number {
    min-width: 50px;
    text-align: right;
    padding-right: 12px;
    padding-left: 8px;
    color: #999;
    user-select: none;
    background-color: #fafafa;
    border-right: 1px solid #e0e0e0;
    flex-shrink: 0;
}

.json-line-content {
    padding-left: 8px;
    flex-grow: 1;
}

.json-toggle {
    display: inline-block;
    width: 18px;
    height: 18px;
    line-height: 16px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    color: #888;
    margin-right: 2px;
    font-size: 11px;
    border-radius: 3px;
    transition: all 0.15s;
    vertical-align: middle;
}

.json-toggle:hover {
    background-color: #e0e0e0;
    color: #444;
}

.json-key {
    color: #92278f;
    font-weight: 500;
}

.json-string {
    color: #c41a16;
}

.json-number {
    color: #1c00cf;
}

.json-boolean {
    color: #0d22ff;
    font-weight: 600;
}

.json-null {
    color: #999;
    font-weight: 500;
}

.json-bracket {
    color: #333;
    font-weight: normal;
}

.json-collapsed {
    display: none;
}

.json-comma {
    color: #333;
    margin-left: -1px;
}

.json-indent {
    display: inline-block;
}

.json-summary {
    color: #aaa;
    font-style: normal;
    margin-left: 8px;
    font-size: 12px;
}

.json-colon {
    margin: 0 6px 0 2px;
    color: #333;
}
</style>

{% endblock %}

{% block scripts %}
<script>
    const inputArea = document.getElementById('inputJson');
    const inputLineNumbers = document.getElementById('inputLineNumbers');
    const outputDiv = document.getElementById('outputJson');
    const statusMsg = document.getElementById('statusMsg');
    let parsedJson = null;
    let currentLineNumber = 0;

    function showStatus(msg, isError = false) {
        statusMsg.textContent = msg;
        statusMsg.className = isError ? "text-red-600" : "text-green-600";
        statusMsg.classList.remove('hidden');
        setTimeout(() => statusMsg.classList.add('hidden'), 3000);
    }

    // 更新输入区行号
    function updateInputLineNumbers() {
        const lines = inputArea.value.split('\n');
        const lineCount = lines.length;
        let lineNumbersHtml = '';
        for (let i = 1; i <= lineCount; i++) {
            lineNumbersHtml += i + '\n';
        }
        inputLineNumbers.textContent = lineNumbersHtml;
    }

    // 同步滚动
    inputArea.addEventListener('scroll', function() {
        inputLineNumbers.scrollTop = inputArea.scrollTop;
    });

    // 实时更新结果
    inputArea.addEventListener('input', function() {
        updateInputLineNumbers();
        updateTreeView();
    });

    // 支持Tab键缩进
    inputArea.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            
            const start = this.selectionStart;
            const end = this.selectionEnd;
            const value = this.value;
            
            // 插入Tab（使用4个空格）
            this.value = value.substring(0, start) + '    ' + value.substring(end);
            
            // 恢复光标位置
            this.selectionStart = this.selectionEnd = start + 4;
            
            // 触发更新
            updateTreeView();
        }
    });

    function updateTreeView() {
        const content = inputArea.value.trim();
        if (!content) {
            outputDiv.innerHTML = '<div class="text-gray-400 italic">等待输入...</div>';
            return;
        }

        try {
            parsedJson = JSON.parse(content);
            renderJsonTree();
            showStatus("JSON 有效");
        } catch (e) {
            outputDiv.innerHTML = `<div class="text-red-600"><strong>JSON 解析错误：</strong><br>${escapeHtml(e.message)}</div>`;
            parsedJson = null;
        }
    }

    function renderJsonTree() {
        if (!parsedJson) return;
        
        currentLineNumber = 0;
        outputDiv.innerHTML = '<div class="json-tree">' + createJsonTree(parsedJson, 0, 'root') + '</div>';
    }

    function createJsonTree(obj, level, key, isLast = true) {
        const indent = '&nbsp;'.repeat(level * 4);
        let html = '';
        
        if (obj === null) {
            currentLineNumber++;
            return `<div class="json-line"><span class="json-line-number">${currentLineNumber}</span><span class="json-line-content">${indent}<span class="json-null">null</span></span></div>`;
        }

        const type = Array.isArray(obj) ? 'array' : typeof obj;

        if (type === 'object' || type === 'array') {
            const isArray = type === 'array';
            const entries = isArray ? obj : Object.entries(obj);
            const length = isArray ? obj.length : Object.keys(obj).length;
            const isEmpty = length === 0;
            
            const openBracket = isArray ? '[' : '{';
            const closeBracket = isArray ? ']' : '}';
            const summary = getSummary(obj);
            
            const toggleId = 'toggle-' + Math.random().toString(36).substr(2, 9);
            
            currentLineNumber++;
            html += `<div class="json-line">`;
            html += `<span class="json-line-number">${currentLineNumber}</span>`;
            html += `<span class="json-line-content">`;
            html += `${indent}`;
            if (!isEmpty) {
                html += `<span class="json-toggle" onclick="toggleCollapse('${toggleId}')">▼</span>`;
            } else {
                html += `<span style="display:inline-block;width:20px;"></span>`;
            }
            html += `<span class="json-bracket">${openBracket}</span>`;
            html += `<span class="json-summary" id="${toggleId}-summary" style="display:none;">${summary}</span>`;
            if (isEmpty) {
                html += `<span class="json-bracket">${closeBracket}</span>`;
                if (!isLast) html += `<span class="json-comma">,</span>`;
            }
            html += `</span></div>`;

            if (!isEmpty) {
                html += `<div id="${toggleId}">`;
                
                if (isArray) {
                    obj.forEach((item, index) => {
                        const isLastItem = index === obj.length - 1;
                        if (typeof item === 'object' && item !== null) {
                            const innerTree = createJsonTree(item, level + 1, index.toString(), isLastItem);
                            html += innerTree;
                        } else {
                            currentLineNumber++;
                            html += `<div class="json-line">`;
                            html += `<span class="json-line-number">${currentLineNumber}</span>`;
                            html += `<span class="json-line-content">${'&nbsp;'.repeat((level + 1) * 4)}`;
                            html += `<span style="display:inline-block;width:20px;"></span>`;
                            html += `${formatValue(item)}${isLastItem ? '' : '<span class="json-comma">,</span>'}`;
                            html += `</span></div>`;
                        }
                    });
                } else {
                    const keys = Object.keys(obj);
                    keys.forEach((k, index) => {
                        const isLastItem = index === keys.length - 1;
                        const value = obj[k];
                        
                        if (typeof value === 'object' && value !== null) {
                            // 对象或数组值，需要递归处理
                            const isArrayValue = Array.isArray(value);
                            const innerLength = isArrayValue ? value.length : Object.keys(value).length;
                            const innerIsEmpty = innerLength === 0;
                            const innerOpenBracket = isArrayValue ? '[' : '{';
                            const innerCloseBracket = isArrayValue ? ']' : '}';
                            const innerSummary = getSummary(value);
                            const innerToggleId = 'toggle-' + Math.random().toString(36).substr(2, 9);
                            
                            currentLineNumber++;
                            html += `<div class="json-line">`;
                            html += `<span class="json-line-number">${currentLineNumber}</span>`;
                            html += `<span class="json-line-content">${'&nbsp;'.repeat((level + 1) * 4)}`;
                            if (!innerIsEmpty) {
                                html += `<span class="json-toggle" onclick="toggleCollapse('${innerToggleId}')">▼</span>`;
                            } else {
                                html += `<span style="display:inline-block;width:20px;"></span>`;
                            }
                            html += `<span class="json-key">"${escapeHtml(k)}"</span><span class="json-colon">:</span>`;
                            html += `<span class="json-bracket">${innerOpenBracket}</span>`;
                            html += `<span class="json-summary" id="${innerToggleId}-summary" style="display:none;">${innerSummary}</span>`;
                            if (innerIsEmpty) {
                                html += `<span class="json-bracket">${innerCloseBracket}</span>`;
                                if (!isLastItem) html += `<span class="json-comma">,</span>`;
                            }
                            html += `</span></div>`;
                            
                            if (!innerIsEmpty) {
                                html += `<div id="${innerToggleId}">`;
                                const innerContent = renderInnerContent(value, level + 2);
                                html += innerContent;
                                html += `</div>`;
                                
                                currentLineNumber++;
                                html += `<div class="json-line">`;
                                html += `<span class="json-line-number">${currentLineNumber}</span>`;
                                html += `<span class="json-line-content">${'&nbsp;'.repeat((level + 1) * 4)}<span style="display:inline-block;width:20px;"></span><span class="json-bracket">${innerCloseBracket}</span>${!isLastItem ? '<span class="json-comma">,</span>' : ''}`;
                                html += `</span></div>`;
                            }
                        } else {
                            currentLineNumber++;
                            html += `<div class="json-line">`;
                            html += `<span class="json-line-number">${currentLineNumber}</span>`;
                            html += `<span class="json-line-content">${'&nbsp;'.repeat((level + 1) * 4)}`;
                            html += `<span style="display:inline-block;width:20px;"></span>`;
                            html += `<span class="json-key">"${escapeHtml(k)}"</span><span class="json-colon">:</span>${formatValue(value)}${isLastItem ? '' : '<span class="json-comma">,</span>'}`;
                            html += `</span></div>`;
                        }
                    });
                }
                
                html += `</div>`;
                currentLineNumber++;
                html += `<div class="json-line">`;
                html += `<span class="json-line-number">${currentLineNumber}</span>`;
                html += `<span class="json-line-content">${indent}<span style="display:inline-block;width:20px;"></span><span class="json-bracket">${closeBracket}</span>${!isLast ? '<span class="json-comma">,</span>' : ''}`;
                html += `</span></div>`;
            }
        } else {
            currentLineNumber++;
            html += `<div class="json-line">`;
            html += `<span class="json-line-number">${currentLineNumber}</span>`;
            html += `<span class="json-line-content">${indent}${formatValue(obj)}`;
            html += `</span></div>`;
        }

        return html;
    }

    function formatValue(value) {
        if (value === null) {
            return '<span class="json-null">null</span>';
        }
        
        const type = typeof value;
        
        if (type === 'string') {
            return `<span class="json-string">"${escapeHtml(value)}"</span>`;
        } else if (type === 'number') {
            return `<span class="json-number">${value}</span>`;
        } else if (type === 'boolean') {
            return `<span class="json-boolean">${value}</span>`;
        }
        
        return escapeHtml(String(value));
    }

    function getSummary(obj) {
        if (Array.isArray(obj)) {
            return `... ${obj.length} items`;
        } else if (typeof obj === 'object') {
            const keys = Object.keys(obj);
            return `... ${keys.length} keys`;
        }
        return '';
    }

    function renderInnerContent(obj, level) {
        let html = '';
        
        if (Array.isArray(obj)) {
            obj.forEach((item, index) => {
                const isLastItem = index === obj.length - 1;
                if (typeof item === 'object' && item !== null) {
                    const innerTree = createJsonTree(item, level, index.toString(), isLastItem);
                    html += innerTree;
                } else {
                    currentLineNumber++;
                    html += `<div class="json-line">`;
                    html += `<span class="json-line-number">${currentLineNumber}</span>`;
                    html += `<span class="json-line-content">${'&nbsp;'.repeat(level * 4)}`;
                    html += `<span style="display:inline-block;width:20px;"></span>`;
                    html += `${formatValue(item)}${isLastItem ? '' : '<span class="json-comma">,</span>'}`;
                    html += `</span></div>`;
                }
            });
        } else {
            const keys = Object.keys(obj);
            keys.forEach((k, index) => {
                const isLastItem = index === keys.length - 1;
                const value = obj[k];
                
                if (typeof value === 'object' && value !== null) {
                    const isArrayValue = Array.isArray(value);
                    const innerLength = isArrayValue ? value.length : Object.keys(value).length;
                    const innerIsEmpty = innerLength === 0;
                    const innerOpenBracket = isArrayValue ? '[' : '{';
                    const innerCloseBracket = isArrayValue ? ']' : '}';
                    const innerSummary = getSummary(value);
                    const innerToggleId = 'toggle-' + Math.random().toString(36).substr(2, 9);
                    
                    currentLineNumber++;
                    html += `<div class="json-line">`;
                    html += `<span class="json-line-number">${currentLineNumber}</span>`;
                    html += `<span class="json-line-content">${'&nbsp;'.repeat(level * 4)}`;
                    if (!innerIsEmpty) {
                        html += `<span class="json-toggle" onclick="toggleCollapse('${innerToggleId}')">▼</span>`;
                    } else {
                        html += `<span style="display:inline-block;width:20px;"></span>`;
                    }
                    html += `<span class="json-key">"${escapeHtml(k)}"</span><span class="json-colon">:</span>`;
                    html += `<span class="json-bracket">${innerOpenBracket}</span>`;
                    html += `<span class="json-summary" id="${innerToggleId}-summary" style="display:none;">${innerSummary}</span>`;
                    if (innerIsEmpty) {
                        html += `<span class="json-bracket">${innerCloseBracket}</span>`;
                        if (!isLastItem) html += `<span class="json-comma">,</span>`;
                    }
                    html += `</span></div>`;
                    
                    if (!innerIsEmpty) {
                        html += `<div id="${innerToggleId}">`;
                        html += renderInnerContent(value, level + 1);
                        html += `</div>`;
                        
                        currentLineNumber++;
                        html += `<div class="json-line">`;
                        html += `<span class="json-line-number">${currentLineNumber}</span>`;
                        html += `<span class="json-line-content">${'&nbsp;'.repeat(level * 4)}<span style="display:inline-block;width:20px;"></span><span class="json-bracket">${innerCloseBracket}</span>${!isLastItem ? '<span class="json-comma">,</span>' : ''}`;
                        html += `</span></div>`;
                    }
                } else {
                    currentLineNumber++;
                    html += `<div class="json-line">`;
                    html += `<span class="json-line-number">${currentLineNumber}</span>`;
                    html += `<span class="json-line-content">${'&nbsp;'.repeat(level * 4)}`;
                    html += `<span style="display:inline-block;width:20px;"></span>`;
                    html += `<span class="json-key">"${escapeHtml(k)}"</span><span class="json-colon">:</span>${formatValue(value)}${isLastItem ? '' : '<span class="json-comma">,</span>'}`;
                    html += `</span></div>`;
                }
            });
        }
        
        return html;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function toggleCollapse(toggleId) {
        const content = document.getElementById(toggleId);
        const summary = document.getElementById(toggleId + '-summary');
        const toggle = content.previousElementSibling.querySelector('.json-toggle');
        
        if (content.style.display === 'none') {
            content.style.display = 'block';
            summary.style.display = 'none';
            toggle.textContent = '▼';
        } else {
            content.style.display = 'none';
            summary.style.display = 'inline';
            toggle.textContent = '▶';
        }
    }

    function expandAll() {
        document.querySelectorAll('.json-tree [id^="toggle-"]').forEach(el => {
            if (!el.id.endsWith('-summary')) {
                el.style.display = 'block';
                const summary = document.getElementById(el.id + '-summary');
                if (summary) summary.style.display = 'none';
                const toggle = el.previousElementSibling?.querySelector('.json-toggle');
                if (toggle) toggle.textContent = '▼';
            }
        });
        showStatus("已全部展开");
    }

    function collapseAll() {
        document.querySelectorAll('.json-tree [id^="toggle-"]').forEach(el => {
            if (!el.id.endsWith('-summary')) {
                el.style.display = 'none';
                const summary = document.getElementById(el.id + '-summary');
                if (summary) summary.style.display = 'inline';
                const toggle = el.previousElementSibling?.querySelector('.json-toggle');
                if (toggle) toggle.textContent = '▶';
            }
        });
        showStatus("已全部折叠");
    }

    function formatInput() {
        const content = inputArea.value.trim();
        if (!content) return;

        try {
            const obj = JSON.parse(content);
            inputArea.value = JSON.stringify(obj, null, 2);
            updateInputLineNumbers();
            updateTreeView();
            showStatus("输入已格式化");
        } catch (e) {
            showStatus("JSON 格式错误", true);
        }
    }

    function compressInput() {
        const content = inputArea.value.trim();
        if (!content) return;

        try {
            const obj = JSON.parse(content);
            inputArea.value = JSON.stringify(obj);
            updateInputLineNumbers();
            updateTreeView();
            showStatus("输入已压缩");
        } catch (e) {
            showStatus("JSON 格式错误", true);
        }
    }

    function escapeJson() {
        const content = inputArea.value.trim();
        if (!content) return;

        try {
            // 先验证是否是有效的JSON
            JSON.parse(content);
            // 将JSON内容转义为字符串
            const escaped = JSON.stringify(content);
            inputArea.value = escaped;
            updateInputLineNumbers();
            showStatus("已转译");
            // 转译后的内容不是有效JSON，清空输出
            outputDiv.innerHTML = '<div class="text-gray-400 italic">转译后的内容不是有效的JSON</div>';
            parsedJson = null;
        } catch (e) {
            showStatus("JSON 格式错误", true);
        }
    }

    function unescapeJson() {
        const content = inputArea.value.trim();
        if (!content) return;

        try {
            // 尝试解析转义的字符串
            const unescaped = JSON.parse(content);
            
            // 检查解析后的是否为字符串
            if (typeof unescaped === 'string') {
                inputArea.value = unescaped;
                updateInputLineNumbers();
                updateTreeView();
                showStatus("已去转译");
            } else {
                showStatus("内容不是转义的JSON字符串", true);
            }
        } catch (e) {
            showStatus("去转译失败，内容格式不正确", true);
        }
    }

    function copyFormattedJson() {
        if (!parsedJson) {
            showStatus("没有有效的JSON可复制", true);
            return;
        }

        const formatted = JSON.stringify(parsedJson, null, 2);
        
        // 使用现代的 Clipboard API
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(formatted).then(() => {
                showStatus("已复制格式化的JSON到剪贴板");
            }).catch(() => {
                // 降级方案
                fallbackCopy(formatted);
            });
        } else {
            fallbackCopy(formatted);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showStatus("已复制格式化的JSON到剪贴板");
        } catch (e) {
            showStatus("复制失败", true);
        }
        document.body.removeChild(textarea);
    }

    function clearAll() {
        inputArea.value = '';
        updateInputLineNumbers();
        outputDiv.innerHTML = '<div class="text-gray-400 italic">等待输入...</div>';
        parsedJson = null;
        inputArea.focus();
    }

    // 初始化
    updateInputLineNumbers();
    updateTreeView();
</script>
{% endblock %}
