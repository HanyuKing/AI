{% extends "base.html" %}

{% block title %}Base64 工具 - Lumina{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto mt-10">
    <div class="glass shadow-lg rounded-lg overflow-hidden p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Base64 编码 / 解码</h2>

        <div class="flex space-x-4 mb-4">
            <button onclick="processBase64('encode')"
                class="px-4 py-2 bg-primary text-white rounded hover:bg-blue-600">编码 (Encode)</button>
            <button onclick="processBase64('decode')"
                class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">解码 (Decode)</button>
            <button onclick="clearAll()"
                class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">清空</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">输入内容</label>
                <textarea id="inputText"
                    class="w-full h-64 p-3 border border-gray-300 rounded-md font-mono text-sm focus:ring-primary focus:border-primary resize-none"
                    placeholder="输入文本..."></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">结果</label>
                <textarea id="outputText"
                    class="w-full h-64 p-3 border border-gray-300 rounded-md font-mono text-sm bg-gray-50 resize-none"
                    readonly placeholder="结果显示在这里..."></textarea>
            </div>
        </div>
    </div>
</div>

<script>
    async function processBase64(action) {
        const text = document.getElementById('inputText').value;
        if (!text) return;

        try {
            const response = await fetch('/api/dev/base64', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, action: action })
            });

            const data = await response.json();
            if (data.success) {
                document.getElementById('outputText').value = data.data;
            } else {
                document.getElementById('outputText').value = "Error: " + data.message;
            }
        } catch (e) {
            document.getElementById('outputText').value = "Network Error";
        }
    }

    function clearAll() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
    }
</script>
{% endblock %}
