{% extends "base.html" %}

{% block title %}二维码生成 - MediaToolbox{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto mt-10">
    <div class="bg-white shadow-lg rounded-lg overflow-hidden p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-6">二维码生成器</h2>

        <div class="flex flex-col md:flex-row gap-8">
            <!-- Inputs -->
            <div class="w-full md:w-1/2 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">内容 (文本或链接)</label>
                    <textarea id="qrText" class="w-full h-32 p-3 border border-gray-300 rounded-md focus:ring-primary focus:border-primary resize-none" placeholder="https://example.com"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">前景色</label>
                        <input type="color" id="fillColor" value="#000000" class="h-10 w-full border-gray-300 rounded cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">背景色</label>
                        <input type="color" id="backColor" value="#ffffff" class="h-10 w-full border-gray-300 rounded cursor-pointer">
                    </div>
                </div>

                <button onclick="generateQr()" class="w-full py-2 bg-primary text-white rounded-md hover:bg-blue-600 font-medium">
                    生成二维码
                </button>
            </div>

            <!-- Output -->
            <div class="w-full md:w-1/2 flex flex-col items-center justify-center bg-gray-50 rounded-lg border border-dashed border-gray-300 p-4">
                <div id="placeholder" class="text-gray-400 text-sm">二维码将显示在这里</div>
                <img id="qrImage" class="hidden max-w-full h-auto border border-gray-200 shadow-sm">
                
                <a id="downloadLink" href="#" class="hidden mt-4 text-primary text-sm font-medium hover:underline">
                    下载图片
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    async function generateQr() {
        const text = document.getElementById('qrText').value.trim();
        const fillColor = document.getElementById('fillColor').value;
        const backColor = document.getElementById('backColor').value;

        if (!text) {
            alert("请输入内容");
            return;
        }

        try {
            const response = await fetch('/api/utils/qrcode', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: text,
                    fill_color: fillColor,
                    back_color: backColor
                })
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                
                const img = document.getElementById('qrImage');
                const placeholder = document.getElementById('placeholder');
                const dlLink = document.getElementById('downloadLink');

                img.src = url;
                img.classList.remove('hidden');
                placeholder.classList.add('hidden');
                
                dlLink.href = url;
                dlLink.download = "qrcode.png";
                dlLink.classList.remove('hidden');
            }
        } catch (e) {
            alert("生成失败");
        }
    }
</script>
{% endblock %}
