{% extends "base.html" %}

{% block title %}字帖生成 - Lumina{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cnchar/cnchar.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cnchar-order/cnchar.order.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cnchar-radical/cnchar.radical.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cnchar-pinyin/cnchar.pinyin.min.js"></script>

<div class="max-w-5xl mx-auto mt-10 print:hidden">
    <div class="glass shadow-lg rounded-lg overflow-hidden p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-6">字帖生成</h2>

        <div class="flex flex-col gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">输入汉字</label>
                <textarea id="inputChars" rows="3"
                    class="w-full border border-gray-300 rounded-md p-2 focus:ring-primary focus:border-primary"
                    placeholder="在此输入要练习的汉字..."></textarea>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">字帖模板</label>
                    <select id="templateType" class="border border-gray-300 rounded-md p-2 w-full" onchange="updateOptions()">
                        <option value="A">模板A (单字行练)</option>
                        <option value="B">模板B (笔顺详解)</option>
                        <option value="C">模板C (全篇通练)</option>
                    </select>
                </div>
                <div>
                     <label class="block text-sm font-medium text-gray-700 mb-1">格宽 (mm)</label>
                     <select id="size" class="border border-gray-300 rounded-md p-2 w-full">
                         <option value="40">40mm (特大号/低幼)</option>
                         <option value="30">30mm (大号/初学)</option>
                         <option value="20">20mm (中号/硬笔)</option>
                         <option value="16" selected>16mm (标准作业本)</option>
                         <option value="12">12mm (小号/密集)</option>
                     </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">文字颜色</label>
                    <input type="color" id="charColor" value="#000000" class="h-10 w-full p-1 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">格子类型</label>
                    <select id="gridType" class="border border-gray-300 rounded-md p-2 w-full">
                        <option value="mizi">米字格</option>
                        <option value="tian">田字格</option>
                        <option value="huigong">回宫格</option>
                        <option value="none">无边框</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-2 mt-2">
                <button onclick="generateCalligraphy()"
                    class="px-6 py-2 bg-primary text-white rounded-md hover:bg-blue-600 shadow-sm transition-colors font-medium">
                    生成字帖
                </button>
                <button onclick="window.print()" id="printBtn" disabled
                    class="px-6 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 shadow-sm transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    <span id="printBtnText">打印 (生成中...)</span>
                </button>
            </div>
             <div class="mt-2 text-xs text-gray-500">
                <p><strong>优化说明：</strong> 已启用 SVG 符号重用技术，大幅减少打印预览时的内存占用，并优化了字体填充率。</p>
            </div>
        </div>
    </div>
</div>

<!-- Invisible SVG Defs Container -->
<svg id="svgDefsContainer" width="0" height="0" style="position:absolute; visibility:hidden;">
    <defs id="globalDefs"></defs>
</svg>

<!-- Pages Container -->
<div id="pagesRoot" class="w-full flex flex-col items-center gap-8 bg-gray-100 py-8 print:p-0 print:gap-0 print:bg-white">
    <!-- Pages will be injected here -->
</div>

<style>
    /* Print Setup */
    @media print {
        @page {
            size: A4;
            margin: 0;
        }
        body { margin: 0; padding: 0; background: white; }
        .print\:hidden { display: none !important; }
        #pagesRoot { 
            display: block !important; 
            padding: 0 !important; 
            background: white !important; 
            gap: 0 !important;
        }
        .page-container {
            box-shadow: none !important;
            margin: 0 auto !important;
            page-break-after: always;
            width: 210mm !important;
            height: 297mm !important; 
            min-height: 297mm !important;
            overflow: hidden;
            padding: 15mm !important; 
        }
        .char-row { page-break-inside: avoid; }
    }

    /* Common Grid Styles */
    .page-container {
        background: white;
        width: 210mm;
        min-height: 297mm;
        padding: 15mm;
        position: relative;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        box-sizing: border-box;
    }

    .char-box {
        position: relative;
        border: 1px solid #10b981;
        box-sizing: border-box;
        margin-right: -1px;
        margin-bottom: -1px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
    }
    
    .char-row {
        display: flex;
        flex-wrap: nowrap;
        width: 100%;
        margin-bottom: -1px;
    }

    /* Grid Backgrounds */
    .bg-mizi {
        background-image: 
            linear-gradient(45deg, transparent 49.5%, #d1fae5 49.5%, #d1fae5 50.5%, transparent 50.5%),
            linear-gradient(-45deg, transparent 49.5%, #d1fae5 49.5%, #d1fae5 50.5%, transparent 50.5%),
            linear-gradient(90deg, transparent 49.5%, #d1fae5 49.5%, #d1fae5 50.5%, transparent 50.5%),
            linear-gradient(0deg, transparent 49.5%, #d1fae5 49.5%, #d1fae5 50.5%, transparent 50.5%);
        background-size: 100% 100%;
    }

    .bg-tian {
        background-image: 
            linear-gradient(90deg, transparent 49.5%, #d1fae5 49.5%, #d1fae5 50.5%, transparent 50.5%),
            linear-gradient(0deg, transparent 49.5%, #d1fae5 49.5%, #d1fae5 50.5%, transparent 50.5%);
        background-size: 100% 100%;
    }
    
    .bg-huigong::before {
        content: '';
        position: absolute;
        width: 50%;
        height: 50%;
        border: 1px dashed #d1fae5;
        top: 25%;
        left: 25%;
    }
    
    /* Pinyin & Info */
    .pinyin-top {
        position: absolute;
        top: -0.9em;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 0.8em;
        color: #374151;
        font-family: serif;
        line-height: 1;
    }

    .info-box {
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        align-items: center;
        color: #374151;
        border-left: 1px solid #10b981;
        background-color: #f9fafb;
    }
    .info-box span { display: block; transform: scale(0.9); }

    .hanzi-svg { width: 100%; height: 100%; display: block; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
</style>

<script>
    const PAGE_WIDTH_MM = 210;
    const PAGE_HEIGHT_MM = 297;
    const PAGE_PADDING_MM = 15;
    const CONTENT_WIDTH_MM = PAGE_WIDTH_MM - (PAGE_PADDING_MM * 2);
    const TITLE_HEIGHT_MM = 20; 
    const CONTENT_HEIGHT_MM = PAGE_HEIGHT_MM - (PAGE_PADDING_MM * 2) - TITLE_HEIGHT_MM;

    // Cache: map key -> symbolId
    const symbolCache = new Map();

    async function generateCalligraphy() {
        const text = document.getElementById('inputChars').value.trim();
        const template = document.getElementById('templateType').value;
        const sizeMM = parseInt(document.getElementById('size').value);
        const gridType = document.getElementById('gridType').value;
        const charColor = document.getElementById('charColor').value;
        
        const pagesRoot = document.getElementById('pagesRoot');
        const printBtn = document.getElementById('printBtn');
        const printBtnText = document.getElementById('printBtnText');
        
        printBtn.disabled = true;
        printBtnText.innerText = "生成中...";
        pagesRoot.innerHTML = '';
        
        // Clear global defs
        document.getElementById('globalDefs').innerHTML = '';
        symbolCache.clear();

        const chars = text.split('').filter(c => c.trim());
        if (chars.length === 0) {
            printBtn.disabled = false;
            printBtnText.innerText = "打印";
            return;
        }

        if (template === 'A' || template === 'B') {
            await renderRowBased(chars, template, sizeMM, gridType, charColor, pagesRoot);
        } else if (template === 'C') {
            await renderContinuous(chars, sizeMM, gridType, charColor, pagesRoot);
        }
        
        // Update Page Numbers
        updatePageNumbers();

        printBtn.disabled = false;
        printBtnText.innerText = "打印";
    }

    function createPage() {
        const page = document.createElement('div');
        page.className = 'page-container';
        
        const title = document.createElement('div');
        title.className = 'text-center mb-4 print:mb-4';
        title.innerHTML = '<h1 class="text-2xl font-serif text-gray-800">汉字书写练习</h1>';
        page.appendChild(title);

        const content = document.createElement('div');
        content.className = 'flex flex-col mx-auto bg-white';
        content.style.width = '100%';
        page.appendChild(content);

        const footer = document.createElement('div');
        footer.className = 'absolute bottom-4 left-0 w-full text-center text-xs text-gray-400 font-sans print:block page-footer';
        // Page number will be set later
        page.appendChild(footer);

        document.getElementById('pagesRoot').appendChild(page);
        return content;
    }
    
    function updatePageNumbers() {
        const footers = document.querySelectorAll('.page-footer');
        const total = footers.length;
        footers.forEach((footer, index) => {
            footer.innerText = `Lumina Tools · 第 ${index + 1} 页 / 共 ${total} 页`;
        });
    }

    // --- Row Based Rendering ---
    async function renderRowBased(chars, template, size, grid, color, root) {
        const rowHeight = size; 
        const maxRows = Math.floor(CONTENT_HEIGHT_MM / rowHeight);
        
        let currentPageContainer = createPage();
        let currentRowCount = 0;

        for (const char of chars) {
            if (currentRowCount >= maxRows) {
                currentPageContainer = createPage();
                currentRowCount = 0;
            }

            const rowDiv = document.createElement('div');
            rowDiv.className = 'char-row';
            
            if (template === 'A') {
                rowDiv.style.justifyContent = 'center';
                const cols = Math.floor(CONTENT_WIDTH_MM / size);
                for (let i = 0; i < cols; i++) {
                    const cell = createCell(size, grid);
                    rowDiv.appendChild(cell);
                    renderCharWithUse(cell, char, { outlineMode: i > 0, color: color });
                }
            } else if (template === 'B') {
                rowDiv.style.justifyContent = 'flex-start';
                const infoWidth = size * 0.8;
                const availableWidth = CONTENT_WIDTH_MM - size - infoWidth;
                const strokeCols = Math.floor(availableWidth / size);

                // 1. Main
                const mainCell = createCell(size, grid);
                const py = cnchar.spell(char, 'tone');
                if (py) {
                    const pyDiv = document.createElement('div');
                    pyDiv.className = 'pinyin-top';
                    pyDiv.innerText = Array.isArray(py) ? py[0] : py;
                    mainCell.appendChild(pyDiv);
                }
                rowDiv.appendChild(mainCell);
                renderCharWithUse(mainCell, char, { outlineMode: false, color: color });

                // 2. Info
                const infoDiv = document.createElement('div');
                infoDiv.className = 'char-box info-box';
                infoDiv.style.width = infoWidth + 'mm';
                infoDiv.style.height = size + 'mm';
                const strokes = cnchar.stroke(char);
                const radical = cnchar.radical(char);
                const fontSize = Math.max(8, size * 0.35); 
                infoDiv.style.fontSize = fontSize + 'px';
                infoDiv.innerHTML = `<span>${char}</span><span>${strokes}画</span><span>${radical?radical:''}</span>`;
                rowDiv.appendChild(infoDiv);

                // 3. Strokes (Dynamic, hard to optimize with <use> if unique per step)
                // But we can optimize the Trace part at the end
                // We'll use standard render for strokes (unique) and <use> for trace
                // Need to know stroke count first.
                
                // We use a simplified approach: just load it. 
                // For template B, performace impact is smaller than full page trace.
                await renderStrokeOrderRow(rowDiv, char, size, grid, color, strokeCols);
            }

            currentPageContainer.appendChild(rowDiv);
            currentRowCount++;
        }
    }

    async function renderStrokeOrderRow(rowDiv, char, size, grid, color, maxCols) {
        // Create cells first
        const cells = [];
        for(let i=0; i<maxCols; i++) {
            const cell = createCell(size, grid);
            rowDiv.appendChild(cell);
            cells.push(cell);
        }

        // We need stroke data
        return new Promise(resolve => {
             HanziWriter.loadCharacterData(char).then(charData => {
                 const numStrokes = charData.strokes.length;
                 
                 for(let i=0; i<maxCols; i++) {
                     if (i < numStrokes) {
                         // Unique step - render normally
                         HanziWriter.create(cells[i], char, {
                             width: 128, height: 128, padding: 4,
                             strokeColor: (data) => {
                                 if (data.strokeNum === i) return '#ef4444';
                                 if (data.strokeNum < i) return '#000000';
                                 return 'rgba(0,0,0,0)';
                             },
                             showOutline: true, outlineColor: '#e5e7eb',
                             renderer: 'svg',
                             onLoadCharDataSuccess: () => fixSvg(cells[i])
                         });
                     } else {
                         // Trace - use <use> optimization!
                         renderCharWithUse(cells[i], char, { outlineMode: true, color: color });
                     }
                 }
                 resolve();
             }).catch(resolve);
        });
    }

    // --- Continuous Rendering ---
    async function renderContinuous(chars, size, grid, color, root) {
        const cols = Math.floor(CONTENT_WIDTH_MM / size);
        const rows = Math.floor(CONTENT_HEIGHT_MM / size);
        const cellsPerPage = cols * rows;

        let charIndex = 0;
        let totalCharsToRender = chars.length;
        if (totalCharsToRender < cellsPerPage) totalCharsToRender = cellsPerPage;
        
        let printedCount = 0;
        let currentPageContainer = createPage();
        let currentGridWrapper = createGridWrapper(cols, size);
        currentPageContainer.appendChild(currentGridWrapper);
        
        while (printedCount < totalCharsToRender) {
             if (currentGridWrapper.children.length >= cellsPerPage) {
                 currentPageContainer = createPage();
                 currentGridWrapper = createGridWrapper(cols, size);
                 currentPageContainer.appendChild(currentGridWrapper);
             }

             const char = chars[charIndex % chars.length];
             const cell = createCell(size, grid);
             currentGridWrapper.appendChild(cell);
             
             renderCharWithUse(cell, char, { outlineMode: true, color: color });
             
             printedCount++;
             charIndex++;
             
             if (chars.length > cellsPerPage && printedCount >= chars.length) break;
        }
    }

    function createGridWrapper(cols, size) {
        const div = document.createElement('div');
        div.style.display = 'flex';
        div.style.flexWrap = 'wrap';
        div.style.width = (cols * size) + 'mm';
        div.style.margin = '0 auto';
        return div;
    }

    function createCell(size, grid) {
        const div = document.createElement('div');
        div.className = 'char-box';
        div.style.width = size + 'mm';
        div.style.height = size + 'mm';
        if (grid === 'mizi') div.classList.add('bg-mizi');
        if (grid === 'tian') div.classList.add('bg-tian');
        if (grid === 'huigong') div.classList.add('bg-huigong');
        if (grid === 'none') div.style.border = 'none';
        return div;
    }

    // --- <USE> Optimization Logic ---

    function getSymbolId(char, options) {
        // Sanitize color for ID (remove #)
        const colorSafe = options.color.replace('#', '');
        return `sym-${char}-${options.outlineMode ? 'out' : 'solid'}-${colorSafe}`;
    }

    async function renderCharWithUse(el, char, options) {
        const symbolId = getSymbolId(char, options);
        
        // 1. If symbol exists, just USE it
        if (symbolCache.has(symbolId)) {
            insertUseTag(el, symbolId);
            return;
        }

        // 2. If creating (pending), wait? 
        // We simplified: if not in cache, assume we need to create it.
        // But concurrent requests might duplicate creation. 
        // We use a promise map to prevent duplicate work.
        if (symbolCache.has(symbolId + '_pending')) {
             await symbolCache.get(symbolId + '_pending');
             insertUseTag(el, symbolId);
             return;
        }

        // 3. Create Symbol
        const creationPromise = new Promise(resolve => {
            // Create temp container
            const tempDiv = document.createElement('div');
            
            HanziWriter.create(tempDiv, char, {
                width: 128, height: 128, padding: 4, // Reduced padding to 4 to fill box better
                strokeColor: options.outlineMode ? '#9ca3af' : options.color,
                showOutline: true,
                outlineColor: options.outlineMode ? options.color : '#e5e7eb',
                renderer: 'svg',
                onLoadCharDataSuccess: () => {
                    const svg = tempDiv.querySelector('svg');
                    if (svg) {
                        // Extract contents to <symbol>
                        const symbol = document.createElementNS('http://www.w3.org/2000/svg', 'symbol');
                        symbol.setAttribute('id', symbolId);
                        symbol.setAttribute('viewBox', '0 0 128 128');
                        symbol.innerHTML = svg.innerHTML;
                        
                        document.getElementById('globalDefs').appendChild(symbol);
                        symbolCache.set(symbolId, true);
                        insertUseTag(el, symbolId);
                    } else {
                        fallbackChar(el, char);
                    }
                    resolve();
                },
                onLoadCharDataError: () => {
                    fallbackChar(el, char);
                    resolve();
                }
            });
        });
        
        symbolCache.set(symbolId + '_pending', creationPromise);
        await creationPromise;
    }

    function insertUseTag(el, symbolId) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 128 128');
        svg.classList.add('hanzi-svg');
        
        const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        use.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#' + symbolId);
        
        svg.appendChild(use);
        el.appendChild(svg);
    }

    function fixSvg(el) {
        const svg = el.querySelector('svg');
        if (svg) {
            svg.setAttribute('viewBox', '0 0 128 128');
            svg.removeAttribute('width');
            svg.removeAttribute('height');
            svg.classList.add('hanzi-svg');
        }
    }
    
    function fallbackChar(el, char) {
        el.innerText = char;
        el.style.fontSize = '24px';
        el.style.color = '#ccc';
        el.style.fontFamily = 'KaiTi, serif';
    }
    
    // Initial Run
    document.getElementById('inputChars').value = "一二三十木禾";
    generateCalligraphy();
</script>
{% endblock %}
