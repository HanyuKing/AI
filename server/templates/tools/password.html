{% extends "base.html" %}

{% block title %}密码生成器 - Lumina{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10">
    <div class="glass shadow-lg rounded-lg overflow-hidden p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-6">强密码生成器</h2>

        <div class="space-y-6">
            <!-- Length Slider -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">密码长度: <span id="lenVal"
                        class="font-bold text-primary">16</span></label>
                <input type="range" id="length" min="6" max="64" value="16"
                    class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- Options -->
            <div class="grid grid-cols-2 gap-4">
                <div class="flex items-center">
                    <input type="checkbox" id="uppercase" checked
                        class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                    <label for="uppercase" class="ml-2 text-sm text-gray-700">大写字母 (A-Z)</label>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="lowercase" checked
                        class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                    <label for="lowercase" class="ml-2 text-sm text-gray-700">小写字母 (a-z)</label>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="digits" checked
                        class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                    <label for="digits" class="ml-2 text-sm text-gray-700">数字 (0-9)</label>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="symbols" checked
                        class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                    <label for="symbols" class="ml-2 text-sm text-gray-700">特殊符号 (!@#$)</label>
                </div>
            </div>

            <!-- Generate Button -->
            <button onclick="generatePassword()"
                class="w-full py-3 bg-primary text-white rounded-md hover:bg-blue-600 font-bold shadow-md transition duration-200">
                生成密码
            </button>

            <!-- Result -->
            <div class="relative mt-4">
                <input type="text" id="result"
                    class="w-full p-4 bg-gray-50 border border-gray-300 rounded-md text-center font-mono text-xl text-gray-800 tracking-wide focus:outline-none"
                    readonly placeholder="点击生成...">
                <button onclick="copyPassword()"
                    class="absolute right-2 top-2 bottom-2 px-4 bg-white border border-gray-200 rounded text-sm hover:bg-gray-100 text-gray-600 font-medium">
                    复制
                </button>
            </div>
            <div id="copyMsg" class="text-center text-sm text-green-600 mt-2 hidden">已复制!</div>
        </div>
    </div>
</div>

<script>
    const lengthSlider = document.getElementById('length');
    const lenVal = document.getElementById('lenVal');

    lengthSlider.addEventListener('input', function () {
        lenVal.textContent = this.value;
    });

    async function generatePassword() {
        const length = parseInt(lengthSlider.value);
        const uppercase = document.getElementById('uppercase').checked;
        const lowercase = document.getElementById('lowercase').checked;
        const digits = document.getElementById('digits').checked;
        const symbols = document.getElementById('symbols').checked;

        try {
            const response = await fetch('/api/dev/password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    length,
                    include_uppercase: uppercase,
                    include_lowercase: lowercase,
                    include_digits: digits,
                    include_symbols: symbols
                })
            });

            const data = await response.json();
            if (data.success) {
                document.getElementById('result').value = data.data;
                document.getElementById('copyMsg').classList.add('hidden');
            }
        } catch (e) {
            console.error(e);
        }
    }

    function copyPassword() {
        const el = document.getElementById('result');
        if (!el.value) return;
        el.select();
        document.execCommand('copy');
        document.getElementById('copyMsg').classList.remove('hidden');
        setTimeout(() => document.getElementById('copyMsg').classList.add('hidden'), 2000);
    }

    // Initial gen
    generatePassword();
</script>
{% endblock %}
