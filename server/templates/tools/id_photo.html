{% extends "base.html" %}

{% block title %}智能证件照制作 - MediaToolbox{% endblock %}

{% block head %}
<!-- Cropper.js CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .size-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .size-card:hover { border-color: #3b82f6; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    .size-card.active { border-color: #3b82f6; background-color: #eff6ff; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    
    .color-option { transition: transform 0.2s; }
    .color-option:hover { transform: scale(1.1); z-index: 10; }
    .color-option.active { transform: scale(1.15); box-shadow: 0 0 0 2px white, 0 0 0 4px #3b82f6; z-index: 20; }
    
    .category-tab { transition: all 0.2s; cursor: pointer; }
    .category-tab:hover { opacity: 0.8; }

    .workspace-area {
        min-height: 600px;
        background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%), linear-gradient(-45deg, #f1f5f9 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f1f5f9 75%), linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
        background-size: 20px 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="h-[calc(100vh-64px)] flex flex-col bg-gray-50">
    <!-- Top Bar -->
    <div class="bg-white border-b px-6 py-3 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-800">智能证件照制作</h1>
                <p class="text-xs text-gray-500">AI 自动抠图 · 标准尺寸 · 智能美颜</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="resetAll()" class="text-sm text-gray-600 hover:text-gray-900 px-3 py-1.5 rounded hover:bg-gray-100 transition">
                重置
            </button>
            <button id="downloadBtn" disabled onclick="downloadResult()" class="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white rounded-lg text-sm font-medium transition shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                下载证件照
            </button>
            <button id="downloadLayoutBtn" disabled onclick="downloadLayout()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed rounded-lg text-sm font-medium transition shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                下载排版(6寸)
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Left: Workspace -->
        <div class="flex-1 flex flex-col relative bg-gray-100 overflow-hidden">
            <!-- Canvas Area -->
            <div class="flex-1 overflow-auto custom-scrollbar p-8 flex items-center justify-center workspace-area relative" id="workspaceContainer">
                
                <!-- Initial Upload State -->
                <div id="uploadState" class="text-center max-w-lg w-full">
                    <div class="bg-white rounded-2xl shadow-xl p-10 border-2 border-dashed border-gray-300 hover:border-blue-500 transition-colors cursor-pointer group"
                         onclick="document.getElementById('fileInput').click()"
                         ondragover="handleDragOver(event)" 
                         ondrop="handleDrop(event)">
                        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" class="hidden"/>
                        <div class="mb-6 relative">
                            <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto group-hover:scale-110 transition-transform duration-300">
                                <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            </div>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">点击或拖拽上传照片</h3>
                        <p class="text-gray-500 mb-6">支持 JPG, PNG, WEBP 格式 (最大 10MB)</p>
                        <div class="flex justify-center gap-4 text-xs text-gray-400">
                            <span class="flex items-center"><svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg> 自动抠图</span>
                            <span class="flex items-center"><svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg> 智能美颜</span>
                            <span class="flex items-center"><svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg> 高清输出</span>
                        </div>
                    </div>
                </div>

                <!-- Edit State (Cropper) -->
                <div id="editState" class="hidden w-full h-full flex flex-col items-center justify-center">
                    <div class="bg-white p-2 shadow-lg rounded-lg" style="max-width: 90%; max-height: 85%;">
                        <img id="cropImage" class="max-w-full max-h-full block">
                    </div>
                    <!-- Toolbar -->
                    <div class="mt-4 bg-white px-4 py-2 rounded-full shadow-lg flex gap-2">
                        <button onclick="rotateCrop(-90)" class="p-2 hover:bg-gray-100 rounded-full text-gray-600 tooltip" title="左旋转">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        </button>
                        <button onclick="rotateCrop(90)" class="p-2 hover:bg-gray-100 rounded-full text-gray-600 tooltip" title="右旋转">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"></path></svg>
                        </button>
                        <div class="w-px h-6 bg-gray-200 my-auto"></div>
                        <button onclick="flipHorizontal()" class="p-2 hover:bg-gray-100 rounded-full text-gray-600 tooltip" title="水平翻转">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                        </button>
                        <div class="w-px h-6 bg-gray-200 my-auto"></div>
                        <button onclick="resetCrop()" class="p-2 hover:bg-gray-100 rounded-full text-gray-600 tooltip" title="重置裁剪">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- Result State -->
                <div id="resultState" class="hidden w-full h-full flex flex-col items-center justify-center p-8">
                    <div class="bg-white p-4 shadow-2xl rounded-xl border border-gray-200 relative">
                        <!-- Canvas for real-time rendering -->
                        <canvas id="resultCanvas" class="max-h-[500px] object-contain rounded-sm shadow-inner border border-gray-100"></canvas>
                        <div class="absolute -bottom-8 left-0 right-0 text-center text-sm text-gray-500" id="resultMeta"></div>
                    </div>
                    
                    <div class="mt-8 bg-blue-50 text-blue-700 px-4 py-2 rounded-full text-sm font-medium flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        AI处理完成，点击左侧颜色可实时换底
                    </div>
                </div>

                <!-- Loading Overlay -->
                <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
                    <div class="relative">
                        <div class="w-16 h-16 border-4 border-blue-100 rounded-full animate-spin border-t-blue-600"></div>
                        <div class="absolute inset-0 flex items-center justify-center">
                            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                        </div>
                    </div>
                    <h3 class="mt-4 text-lg font-semibold text-gray-800">AI 正在处理...</h3>
                    <p class="text-gray-500 text-sm mt-1" id="loadingText">正在进行人像抠图</p>
                </div>
            </div>
        </div>

        <!-- Right: Settings Sidebar -->
        <div class="w-[360px] bg-white border-l border-gray-200 flex flex-col shadow-lg z-20">
            <div class="p-6 flex-1 overflow-y-auto custom-scrollbar">
                <!-- Section 1: Spec Selection -->
                <div class="mb-8">
                    <label class="block text-sm font-bold text-gray-800 mb-3 flex items-center justify-between">
                        <span>1. 选择规格</span>
                    </label>
                    
                    <!-- Search Box -->
                    <div class="relative mb-3">
                        <input type="text" id="specSearch" placeholder="搜索规格（如：驾照、公务员）" 
                               class="w-full px-3 py-2 pl-9 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                               oninput="searchSpecs(this.value)">
                        <svg class="w-4 h-4 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    
                    <!-- Category Tabs -->
                    <div class="flex gap-1 mb-3 overflow-x-auto custom-scrollbar pb-1" id="categoryTabs">
                        <button onclick="filterCategory('all')" data-category="all" class="category-tab active whitespace-nowrap px-3 py-1.5 text-xs rounded-lg bg-blue-50 text-blue-600 font-medium">
                            全部
                        </button>
                        <button onclick="filterCategory('standard')" data-category="standard" class="category-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200">
                            📏 常用
                        </button>
                        <button onclick="filterCategory('driving')" data-category="driving" class="category-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200">
                            🚗 驾驶
                        </button>
                        <button onclick="filterCategory('exam')" data-category="exam" class="category-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200">
                            📝 考试
                        </button>
                        <button onclick="filterCategory('travel')" data-category="travel" class="category-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200">
                            ✈️ 出入境
                        </button>
                        <button onclick="filterCategory('more')" data-category="more" class="category-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200">
                            更多
                        </button>
                    </div>
                    
                    <!-- Specs Grid -->
                    <div class="grid grid-cols-2 gap-2 max-h-[380px] overflow-y-auto custom-scrollbar pr-1" id="specsContainer">
                        <!-- Will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Section 2: Background Color -->
                <div class="mb-8">
                    <label class="block text-sm font-bold text-gray-800 mb-4">2. 背景颜色</label>
                    <div class="flex flex-wrap gap-4">
                        <button onclick="selectBgColor('#FFFFFF', this)" data-color="#FFFFFF" class="color-option active w-10 h-10 rounded-full border border-gray-200 shadow-sm bg-white relative group" title="白色">
                            <span class="absolute -bottom-6 left-1/2 -translate-x-1/2 text-[10px] text-gray-500 opacity-0 group-hover:opacity-100 transition whitespace-nowrap">白色</span>
                        </button>
                        <button onclick="selectBgColor('#438EDB', this)" data-color="#438EDB" class="color-option w-10 h-10 rounded-full border border-gray-200 shadow-sm relative group" style="background-color: #438EDB;" title="标准蓝">
                            <span class="absolute -bottom-6 left-1/2 -translate-x-1/2 text-[10px] text-gray-500 opacity-0 group-hover:opacity-100 transition whitespace-nowrap">标准蓝</span>
                        </button>
                        <button onclick="selectBgColor('#D9001B', this)" data-color="#D9001B" class="color-option w-10 h-10 rounded-full border border-gray-200 shadow-sm relative group" style="background-color: #D9001B;" title="标准红">
                            <span class="absolute -bottom-6 left-1/2 -translate-x-1/2 text-[10px] text-gray-500 opacity-0 group-hover:opacity-100 transition whitespace-nowrap">标准红</span>
                        </button>
                        <button onclick="selectBgColor('#607D8B', this)" data-color="#607D8B" class="color-option w-10 h-10 rounded-full border border-gray-200 shadow-sm relative group" style="background-color: #607D8B;" title="深灰">
                            <span class="absolute -bottom-6 left-1/2 -translate-x-1/2 text-[10px] text-gray-500 opacity-0 group-hover:opacity-100 transition whitespace-nowrap">深灰</span>
                        </button>
                        <!-- Custom Color -->
                        <div class="relative">
                            <input type="color" id="bgColorPicker" class="w-10 h-10 rounded-full border-0 p-0 overflow-hidden cursor-pointer opacity-0 absolute inset-0 z-10" onchange="updateCustomColor(this.value)">
                            <div class="w-10 h-10 rounded-full border border-gray-200 bg-gradient-to-br from-purple-400 to-pink-400 flex items-center justify-center shadow-sm color-option" id="customColorPreview">
                                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section 3: Advanced -->
                <div class="mb-8">
                    <label class="block text-sm font-bold text-gray-800 mb-4">3. 高级设置</label>
                    <div class="bg-gray-50 rounded-xl p-4 space-y-4">
                        <label class="flex items-center cursor-pointer group">
                            <div class="relative">
                                <input type="checkbox" id="beautifyCheck" checked class="sr-only peer">
                                <div class="w-10 h-6 bg-gray-200 rounded-full peer peer-checked:bg-blue-600 transition-colors"></div>
                                <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-4"></div>
                            </div>
                            <div class="ml-3">
                                <span class="block text-sm font-medium text-gray-700">智能美颜</span>
                                <span class="block text-xs text-gray-500">自动磨皮美白，提升质感</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Bottom Action -->
            <div class="p-6 border-t border-gray-200 bg-gray-50">
                <button id="generateBtn" onclick="generateIdPhoto()" disabled class="w-full py-3.5 px-4 bg-gray-900 hover:bg-black text-white rounded-xl font-bold shadow-lg disabled:bg-gray-300 disabled:cursor-not-allowed disabled:shadow-none transition-all transform hover:-translate-y-0.5 active:translate-y-0">
                    生成证件照
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script>
    // --- Application State ---
    const state = {
        file: null,
        cropper: null,
        transparentBlob: null, // Store the transparent PNG from backend
        config: {
            size: '1inch',
            bgColor: '#FFFFFF',
            beautify: true
        }
    };

    // --- Constants ---
    const SPECS_DATA = {
        // 常用标准
        '1inch': { name: '一寸', w: 25, h: 35, category: 'standard', keywords: '一寸 常用' },
        '2inch': { name: '二寸', w: 35, h: 49, category: 'standard', keywords: '二寸 常用' },
        'small_1inch': { name: '小一寸', w: 22, h: 32, category: 'standard', keywords: '小一寸' },
        'large_1inch': { name: '大一寸', w: 33, h: 48, category: 'standard', keywords: '大一寸' },
        'small_2inch': { name: '小二寸', w: 33, h: 48, category: 'standard', keywords: '小二寸' },
        
        // 驾驶证件
        'driving_license': { name: '驾驶证', w: 22, h: 32, category: 'driving', keywords: '驾驶证 驾照 学车' },
        'driver_qualification': { name: '从业资格证', w: 25, h: 35, category: 'driving', keywords: '从业资格 货运 客运' },
        
        // 考试报名
        'civil_servant': { name: '公务员考试', w: 35, h: 45, category: 'exam', keywords: '公务员 国考 省考' },
        'cet': { name: '英语四六级', w: 25, h: 35, category: 'exam', keywords: '四六级 英语 CET' },
        'ncee': { name: '高考报名', w: 25, h: 35, category: 'exam', keywords: '高考' },
        'postgraduate': { name: '研究生考试', w: 25, h: 35, category: 'exam', keywords: '考研 研究生' },
        'teacher_qualification': { name: '教师资格证', w: 25, h: 35, category: 'exam', keywords: '教资 教师' },
        'cpa': { name: '注册会计师', w: 25, h: 35, category: 'exam', keywords: 'CPA 注会 会计' },
        'judicial_exam': { name: '法律职业资格', w: 25, h: 35, category: 'exam', keywords: '司考 法考 律师' },
        
        // 出入境证件
        'passport': { name: '护照', w: 33, h: 48, category: 'travel', keywords: '护照 出国' },
        'hk_macau_permit': { name: '港澳通行证', w: 33, h: 48, category: 'travel', keywords: '港澳 香港 澳门' },
        'taiwan_permit': { name: '台湾通行证', w: 33, h: 48, category: 'travel', keywords: '台湾' },
        'visa_us': { name: '美国签证', w: 51, h: 51, category: 'travel', keywords: '美国 签证 美签' },
        'visa_schengen': { name: '申根签证', w: 35, h: 45, category: 'travel', keywords: '申根 欧洲 签证' },
        
        // 其他
        'id_card': { name: '身份证', w: 26, h: 32, category: 'more', keywords: '身份证' },
        'student_id': { name: '学生证', w: 25, h: 35, category: 'more', keywords: '学生证' },
        'graduation': { name: '毕业照', w: 35, h: 49, category: 'more', keywords: '毕业 毕业照' },
        'resume': { name: '简历照片', w: 25, h: 35, category: 'more', keywords: '简历 求职' },
        'social_security': { name: '社保卡', w: 26, h: 32, category: 'more', keywords: '社保' },
        'health_cert': { name: '健康证', w: 25, h: 35, category: 'more', keywords: '健康证' }
    };

    // Calculate pixel sizes and ratios
    const SIZE_CONFIG = {};
    Object.keys(SPECS_DATA).forEach(key => {
        const spec = SPECS_DATA[key];
        const w = Math.round(spec.w * 11.811); // mm to px at 300 DPI
        const h = Math.round(spec.h * 11.811);
        SIZE_CONFIG[key] = { w, h, ratio: w/h };
    });

    // --- DOM Elements ---
    const elements = {
        fileInput: document.getElementById('fileInput'),
        uploadState: document.getElementById('uploadState'),
        editState: document.getElementById('editState'),
        resultState: document.getElementById('resultState'),
        cropImage: document.getElementById('cropImage'),
        resultCanvas: document.getElementById('resultCanvas'),
        generateBtn: document.getElementById('generateBtn'),
        downloadBtn: document.getElementById('downloadBtn'),
        downloadLayoutBtn: document.getElementById('downloadLayoutBtn'),
        loadingOverlay: document.getElementById('loadingOverlay'),
        loadingText: document.getElementById('loadingText'),
        workspace: document.getElementById('workspaceContainer'),
        beautifyCheck: document.getElementById('beautifyCheck'),
        resultMeta: document.getElementById('resultMeta')
    };

    // --- Event Listeners ---
    elements.fileInput.addEventListener('change', (e) => {
        if (e.target.files?.[0]) handleFile(e.target.files[0]);
    });

    elements.beautifyCheck.addEventListener('change', (e) => {
        state.config.beautify = e.target.checked;
    });

    // Initialize specs on page load
    document.addEventListener('DOMContentLoaded', () => {
        renderSpecs();
    });

    function handleDragOver(e) {
        e.preventDefault();
        e.currentTarget.classList.add('border-blue-500', 'bg-blue-50');
    }

    function handleDrop(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('border-blue-500', 'bg-blue-50');
        if (e.dataTransfer.files?.[0]) handleFile(e.dataTransfer.files[0]);
    }

    // --- Core Logic ---

    function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            alert('请上传图片文件');
            return;
        }

        state.file = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            elements.cropImage.src = e.target.result;
            
            // Transition UI
            elements.uploadState.classList.add('hidden');
            elements.resultState.classList.add('hidden');
            elements.editState.classList.remove('hidden');
            elements.generateBtn.disabled = false;
            elements.downloadBtn.disabled = true;
            
            initCropper();
        };
        reader.readAsDataURL(file);
    }

    function initCropper() {
        if (state.cropper) state.cropper.destroy();

        state.cropper = new Cropper(elements.cropImage, {
            aspectRatio: SIZE_CONFIG[state.config.size].ratio,
            viewMode: 1,
            dragMode: 'move',
            autoCropArea: 0.8,
            guides: true,
            center: true,
            highlight: false,
            background: false,
            modal: true,
            responsive: true,
        });
    }

    function selectSize(sizeKey) {
        state.config.size = sizeKey;
        
        // Re-render to update active state
        renderSpecs(currentCategory, currentSearch);

        // Cropper Update
        if (state.cropper) {
            state.cropper.setAspectRatio(SIZE_CONFIG[sizeKey].ratio);
        }
    }

    function selectBgColor(color, btnElement) {
        state.config.bgColor = color;
        
        // UI Update
        document.querySelectorAll('.color-option').forEach(el => el.classList.remove('active'));
        if (btnElement) btnElement.classList.add('active');
        
        // If we have the transparent result, update the canvas immediately (Client Side)
        if (state.transparentBlob) {
            renderResultCanvas();
        }
    }

    function updateCustomColor(color) {
        state.config.bgColor = color;
        document.querySelectorAll('.color-option').forEach(el => el.classList.remove('active'));
        const preview = document.getElementById('customColorPreview');
        preview.style.background = color;
        preview.classList.add('active');

        if (state.transparentBlob) {
            renderResultCanvas();
        }
    }

    // --- Actions ---

    function rotateCrop(deg) {
        if (state.cropper) state.cropper.rotate(deg);
    }

    let scaleX = 1;
    function flipHorizontal() {
        if (state.cropper) {
            scaleX = -scaleX;
            state.cropper.scaleX(scaleX);
        }
    }

    function resetCrop() {
        if (state.cropper) state.cropper.reset();
    }

    function resetAll() {
        state.file = null;
        state.transparentBlob = null;
        if (state.cropper) {
            state.cropper.destroy();
            state.cropper = null;
        }
        elements.fileInput.value = '';
        
        elements.editState.classList.add('hidden');
        elements.resultState.classList.add('hidden');
        elements.uploadState.classList.remove('hidden');
        elements.generateBtn.disabled = true;
        elements.downloadBtn.disabled = true;
        elements.downloadLayoutBtn.disabled = true;
    }

    async function generateIdPhoto() {
        if (!state.cropper) return;

        // Show Loading
        elements.loadingOverlay.classList.remove('hidden');
        elements.generateBtn.disabled = true;

        try {
            // 1. Get Cropped Blob
            const blob = await new Promise(resolve => {
                state.cropper.getCroppedCanvas({
                    fillColor: '#fff', // This fill color doesn't matter much as we are sending to backend for matting
                    imageSmoothingQuality: 'high'
                }).toBlob(resolve, 'image/png');
            });

            // 2. Prepare Form Data - Request Transparent Image
            const formData = new FormData();
            formData.append('file', blob, 'source.png');
            formData.append('size', state.config.size);
            formData.append('bg_color', 'transparent'); // KEY CHANGE: Request transparent
            formData.append('beautify', state.config.beautify);

            // 3. API Call
            setTimeout(() => elements.loadingText.textContent = "正在调整尺寸和美颜...", 2000);

            const response = await fetch('/api/media/image/id-photo', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.detail || '生成失败');
            }

            // 4. Handle Result (Transparent PNG)
            state.transparentBlob = await response.blob();
            
            // 5. Render with selected background (Client Side)
            await renderResultCanvas();
            
            elements.editState.classList.add('hidden');
            elements.resultState.classList.remove('hidden');
            elements.downloadBtn.disabled = false;
            elements.downloadLayoutBtn.disabled = false;

        } catch (error) {
            alert(error.message);
        } finally {
            elements.loadingOverlay.classList.add('hidden');
            elements.generateBtn.disabled = false;
        }
    }

    async function renderResultCanvas() {
        if (!state.transparentBlob) return;

        const size = SIZE_CONFIG[state.config.size];
        const canvas = elements.resultCanvas;
        const ctx = canvas.getContext('2d');

        // Set canvas size
        canvas.width = size.w;
        canvas.height = size.h;

        // 1. Fill Background
        ctx.fillStyle = state.config.bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Draw Transparent Person
        const img = await createImageBitmap(state.transparentBlob);
        ctx.drawImage(img, 0, 0, size.w, size.h);

        // Update Meta
        elements.resultMeta.textContent = `规格: ${size.w}x${size.h}px | 背景: ${state.config.bgColor}`;
    }

    function downloadResult() {
        if (!elements.resultCanvas) return;
        
        elements.resultCanvas.toBlob((blob) => {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `证件照_${state.config.size}_${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }, 'image/png');
    }

    async function downloadLayout() {
        if (!state.transparentBlob) return;

        // Standard 6-inch photo paper: 102x152mm
        // @300 DPI: 1205 x 1795 px
        const PAPER_W = 1205;
        const PAPER_H = 1795;
        const MARGIN = 30; // px
        const GAP = 30; // px

        const canvas = document.createElement('canvas');
        canvas.width = PAPER_W;
        canvas.height = PAPER_H;
        const ctx = canvas.getContext('2d');

        // Fill white background for paper
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, PAPER_W, PAPER_H);

        // Prepare the single photo with current background
        const photoCanvas = document.createElement('canvas');
        const size = SIZE_CONFIG[state.config.size];
        photoCanvas.width = size.w;
        photoCanvas.height = size.h;
        const pCtx = photoCanvas.getContext('2d');
        
        pCtx.fillStyle = state.config.bgColor;
        pCtx.fillRect(0, 0, size.w, size.h);
        const personImg = await createImageBitmap(state.transparentBlob);
        pCtx.drawImage(personImg, 0, 0, size.w, size.h);

        // Use the composited photo for layout
        const imgW = size.w;
        const imgH = size.h;

        // Calculate Grid
        const cols = Math.floor((PAPER_W - MARGIN * 2 + GAP) / (imgW + GAP));
        const rows = Math.floor((PAPER_H - MARGIN * 2 + GAP) / (imgH + GAP));

        const gridW = cols * imgW + (cols - 1) * GAP;
        const gridH = rows * imgH + (rows - 1) * GAP;
        
        const startX = (PAPER_W - gridW) / 2;
        const startY = (PAPER_H - gridH) / 2;

        // Draw Grid
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = startX + c * (imgW + GAP);
                const y = startY + r * (imgH + GAP);
                ctx.drawImage(photoCanvas, x, y);
                
                // Optional: Draw cutting lines (light gray)
                ctx.strokeStyle = '#e5e7eb';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, imgW, imgH);
            }
        }

        // Download
        canvas.toBlob((blob) => {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `证件照排版_6寸_${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }, 'image/png');
    }

    // --- Specs Management ---
    let currentCategory = 'all';
    let currentSearch = '';

    function renderSpecs(category = 'all', search = '') {
        const container = document.getElementById('specsContainer');
        if (!container) return;
        
        container.innerHTML = '';
        
        let filteredSpecs = Object.entries(SPECS_DATA);
        
        // Filter by category
        if (category !== 'all') {
            filteredSpecs = filteredSpecs.filter(([key, spec]) => spec.category === category);
        }
        
        // Filter by search
        if (search) {
            const searchLower = search.toLowerCase();
            filteredSpecs = filteredSpecs.filter(([key, spec]) => 
                spec.name.toLowerCase().includes(searchLower) || 
                spec.keywords.toLowerCase().includes(searchLower)
            );
        }
        
        // Render
        filteredSpecs.forEach(([key, spec]) => {
            const isActive = state.config.size === key;
            const btn = document.createElement('button');
            btn.onclick = () => selectSize(key);
            btn.setAttribute('data-size', key);
            btn.className = `size-card ${isActive ? 'active' : ''} text-left p-2.5 rounded-lg border-2 border-gray-100 bg-white`;
            btn.innerHTML = `
                <div class="font-bold text-gray-800 text-xs">${spec.name}</div>
                <div class="text-[10px] text-gray-500 mt-0.5">${spec.w} × ${spec.h} mm</div>
                <div class="text-[9px] text-gray-400">${SIZE_CONFIG[key].w} × ${SIZE_CONFIG[key].h} px</div>
            `;
            container.appendChild(btn);
        });
        
        if (filteredSpecs.length === 0) {
            container.innerHTML = '<div class="col-span-2 text-center text-gray-400 text-sm py-8">未找到匹配的规格</div>';
        }
    }

    function filterCategory(category) {
        currentCategory = category;
        currentSearch = '';
        document.getElementById('specSearch').value = '';
        
        // Update tab styles
        document.querySelectorAll('.category-tab').forEach(tab => {
            const isActive = tab.dataset.category === category;
            if (isActive) {
                tab.className = 'category-tab active whitespace-nowrap px-3 py-1.5 text-xs rounded-lg bg-blue-50 text-blue-600 font-medium';
            } else {
                tab.className = 'category-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200';
            }
        });
        
        renderSpecs(category, currentSearch);
    }

    function searchSpecs(query) {
        currentSearch = query;
        currentCategory = 'all';
        
        // Reset category tabs
        document.querySelectorAll('.category-tab').forEach(tab => {
            if (tab.dataset.category === 'all') {
                tab.className = 'category-tab active whitespace-nowrap px-3 py-1.5 text-xs rounded-lg bg-blue-50 text-blue-600 font-medium';
            } else {
                tab.className = 'category-tab whitespace-nowrap px-3 py-1.5 text-xs rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200';
            }
        });
        
        renderSpecs('all', query);
    }
</script>
{% endblock %}
