{% extends "base.html" %}

{% block title %}智能证件照 - MediaToolbox{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<style>
    * {
        box-sizing: border-box;
    }

    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
    }

    .workspace {
        background: #fafafa;
    }

    .color-btn {
        transition: all 0.15s ease;
        cursor: pointer;
    }

    .color-btn:hover {
        transform: scale(1.1);
    }

    .color-btn.active {
        box-shadow: 0 0 0 2px white, 0 0 0 4px #3b82f6;
    }

    /* 裁剪预览布局 */
    .crop-preview-layout {
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 24px;
        width: 100%;
        height: 100%;
        padding: 24px;
    }

    @media (max-width: 1200px) {
        .crop-preview-layout {
            grid-template-columns: 1fr;
            gap: 16px;
        }
    }

    .crop-area,
    .preview-area {
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .crop-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        border-radius: 8px;
        padding: 16px;
        overflow: hidden;
    }

    .preview-container {
        background: white;
        border-radius: 8px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #previewCanvas {
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* 加载动画优化 */
    #loadingText {
        transition: opacity 0.3s ease-in-out;
    }
</style>
{% endblock %}

{% block content %}
<div class="h-[calc(100vh-64px)] flex bg-white">

    <!-- 左侧：工作区 -->
    <div class="flex-1 flex flex-col">
        <!-- 顶部工具栏 -->
        <div class="h-16 border-b flex items-center justify-between px-8">
            <h1 class="text-xl font-semibold text-gray-900">证件照制作</h1>
            <div class="flex gap-3">
                <button onclick="resetAll()"
                    class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition">
                    重置
                </button>
                <button id="downloadBtn" disabled onclick="downloadResult()"
                    class="px-5 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white text-sm rounded-lg transition">
                    下载
                </button>
                <button id="downloadLayoutBtn" disabled onclick="downloadLayout()"
                    class="px-5 py-2 border border-gray-300 hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 text-sm rounded-lg transition">
                    打印排版
                </button>
            </div>
        </div>

        <!-- 工作区 -->
        <div class="flex-1 workspace overflow-hidden relative" id="workspaceContainer">

            <!-- 上传状态 -->
            <div id="uploadState" class="h-full flex items-center justify-center">
                <div class="text-center">
                    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/bmp"
                        class="hidden" />
                    <button onclick="document.getElementById('fileInput').click()"
                        class="px-8 py-4 bg-gray-900 hover:bg-gray-800 text-white rounded-lg text-lg font-medium transition shadow-lg">
                        选择照片
                    </button>
                    <p class="mt-4 text-sm text-gray-500">支持 JPG、PNG、WEBP、BMP</p>
                </div>
            </div>

            <!-- 编辑状态 - 左右分栏 -->
            <div id="editState" class="hidden h-full">
                <div class="crop-preview-layout">
                    <!-- 左侧：裁剪区 -->
                    <div class="crop-area">
                        <div class="mb-3 text-sm font-medium text-gray-700">调整裁剪</div>
                        <div class="crop-container">
                            <img id="cropImage" style="max-width: 100%; max-height: 100%;">
                        </div>
                        <div class="mt-3 flex justify-center gap-2 bg-white px-4 py-2 rounded-lg border">
                            <button onclick="rotateCrop(-90)" class="p-2 hover:bg-gray-100 rounded transition"
                                title="左旋转">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
                                </svg>
                            </button>
                            <button onclick="rotateCrop(90)" class="p-2 hover:bg-gray-100 rounded transition"
                                title="右旋转">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6" />
                                </svg>
                            </button>
                            <div class="w-px bg-gray-200"></div>
                            <button onclick="flipHorizontal()" class="p-2 hover:bg-gray-100 rounded transition"
                                title="水平翻转">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                                </svg>
                            </button>
                            <button onclick="resetCrop()" class="p-2 hover:bg-gray-100 rounded transition" title="重置">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- 右侧：实时预览 -->
                    <div class="preview-area">
                        <div class="mb-3 text-sm font-medium text-gray-700">实时预览</div>
                        <div class="preview-container flex-1">
                            <canvas id="previewCanvas"></canvas>
                            <div class="mt-4 text-xs text-gray-500 text-center" id="previewMeta">
                                一寸 • 25×35mm • 295×413px
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 加载状态 -->
            <div id="loadingOverlay"
                class="hidden absolute inset-0 bg-white/95 z-50 flex flex-col items-center justify-center">
                <div class="relative mb-6">
                    <!-- 外圈 -->
                    <div class="w-16 h-16 border-4 border-blue-100 rounded-full animate-spin"
                        style="animation-duration: 1s;"></div>
                    <!-- 中圈 -->
                    <div class="absolute inset-2 border-4 border-blue-300 rounded-full animate-spin border-t-transparent"
                        style="animation-duration: 1.5s; animation-direction: reverse;"></div>
                    <!-- 内圈 -->
                    <div class="absolute inset-4 border-4 border-blue-500 rounded-full animate-spin"
                        style="animation-duration: 2s;"></div>
                    <!-- 中心点 -->
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-3 h-3 bg-blue-600 rounded-full animate-pulse"></div>
                    </div>
                </div>
                <h3 class="text-lg font-semibold text-gray-900 mb-2" id="loadingTitle">AI 处理中</h3>
                <p class="text-sm text-gray-600" id="loadingText">正在分析图片...</p>
                <p class="text-xs text-gray-400 mt-2" id="loadingHint"></p>
            </div>
        </div>
    </div>

    <!-- 右侧：配置面板 -->
    <div class="w-[360px] border-l flex flex-col bg-white">
        <div class="flex-1 overflow-y-auto custom-scrollbar">

            <!-- 选择规格 -->
            <div class="p-6 border-b">
                <h3 class="text-sm font-medium text-gray-900 mb-3">选择规格</h3>

                <!-- 搜索选择器 -->
                <div class="relative mb-3">
                    <input type="text" id="specSearchInput" placeholder="搜索规格"
                        class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:border-gray-900">
                    <svg class="w-4 h-4 absolute right-3 top-3 text-gray-400 pointer-events-none" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>

                    <!-- 下拉列表 -->
                    <div id="specDropdown"
                        class="hidden absolute top-full left-0 right-0 mt-1 bg-white border border-gray-300 rounded-lg shadow-lg max-h-[300px] overflow-y-auto custom-scrollbar z-10">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <!-- 当前选择 -->
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg mb-2">
                    <div>
                        <div class="text-sm font-medium text-gray-900" id="currentSpecName">一寸</div>
                        <div class="text-xs text-gray-500" id="currentSpecSize">25×35mm • 295×413px</div>
                    </div>
                    <button onclick="toggleCustomSpec()" class="text-xs text-blue-600 hover:text-blue-700 font-medium">
                        自定义
                    </button>
                </div>

                <!-- 自定义规格 -->
                <div id="customSpecPanel" class="hidden p-3 border border-gray-200 rounded-lg bg-gray-50">
                    <div class="text-xs font-medium text-gray-700 mb-2">自定义尺寸</div>
                    <div class="flex gap-2 items-center mb-2">
                        <input type="number" id="customWidth" placeholder="宽" min="10" max="100"
                            oninput="updateCustomPreview()"
                            class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:border-gray-900">
                        <span class="text-gray-400">×</span>
                        <input type="number" id="customHeight" placeholder="高" min="10" max="150"
                            oninput="updateCustomPreview()"
                            class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:border-gray-900">
                        <span class="text-xs text-gray-500">mm</span>
                    </div>
                    <div class="text-xs text-gray-500 mb-2" id="customPixelPreview">像素尺寸：--</div>
                    <div class="flex gap-2">
                        <button onclick="applyCustomSpec()"
                            class="flex-1 px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs rounded-lg transition">
                            应用
                        </button>
                        <button onclick="toggleCustomSpec()"
                            class="px-3 py-2 border border-gray-300 hover:bg-gray-100 text-xs rounded-lg transition">
                            取消
                        </button>
                    </div>
                </div>
            </div>

            <!-- 背景颜色 -->
            <div class="p-6 border-b">
                <h3 class="text-sm font-medium text-gray-900 mb-3">背景颜色</h3>
                <div class="flex items-center gap-3">
                    <button onclick="selectBgColor('#FFFFFF', this)" data-color="#FFFFFF"
                        class="color-btn active w-11 h-11 rounded-lg border-2 border-gray-300 bg-white"></button>
                    <button onclick="selectBgColor('#438EDB', this)" data-color="#438EDB"
                        class="color-btn w-11 h-11 rounded-lg border-2 border-gray-300"
                        style="background: #438EDB;"></button>
                    <button onclick="selectBgColor('#D9001B', this)" data-color="#D9001B"
                        class="color-btn w-11 h-11 rounded-lg border-2 border-gray-300"
                        style="background: #D9001B;"></button>
                    <button onclick="selectBgColor('#607D8B', this)" data-color="#607D8B"
                        class="color-btn w-11 h-11 rounded-lg border-2 border-gray-300"
                        style="background: #607D8B;"></button>
                    <div class="relative">
                        <input type="color" id="bgColorPicker"
                            class="absolute inset-0 w-11 h-11 opacity-0 cursor-pointer"
                            onchange="updateCustomColor(this.value)">
                        <div
                            class="w-11 h-11 rounded-lg border-2 border-gray-300 flex items-center justify-center bg-gradient-to-br from-red-400 via-purple-400 to-blue-400">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 美颜选项 -->
            <div class="p-6">
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-sm font-medium text-gray-900">智能美颜</span>
                    <div class="relative">
                        <input type="checkbox" id="beautifyCheck" checked class="sr-only peer"
                            onchange="handleBeautifyChange()">
                        <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:bg-blue-600 transition"></div>
                        <div
                            class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition peer-checked:translate-x-5">
                        </div>
                    </div>
                </label>
                <p class="text-xs text-gray-500 mt-2">注意：美颜需要重新抠图处理</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script>
    // 状态
    const state = {
        file: null,
        cropper: null,
        transparentImageBlob: null, // AI抠图后的透明PNG
        downloadCanvas: null, // 用于下载的高质量Canvas
        config: {
            size: '1inch',
            bgColor: '#FFFFFF',
            beautify: true,
            customWidth: null,
            customHeight: null
        }
    };

    // 规格数据（从 API 动态加载）
    let SPECS_DATA = null;
    let SIZE_CONFIG = {};
    let CATEGORIES_DATA = {};

    // 初始化规格数据
    async function loadSpecs() {
        try {
            const response = await fetch('/api/media/image/id-photo/specs');
            if (!response.ok) throw new Error('Failed to load specs');
            const data = await response.json();

            // 转换数据结构为前端需要的格式
            SPECS_DATA = {};
            CATEGORIES_DATA = data.specs;

            // 扁平化规格数据
            for (const [categoryId, categoryData] of Object.entries(data.specs)) {
                for (const [specId, specInfo] of Object.entries(categoryData.specs)) {
                    SPECS_DATA[specId] = {
                        name: specInfo.name,
                        w: specInfo.size_mm[0],
                        h: specInfo.size_mm[1],
                        category: categoryData.category_name,
                        categoryIcon: categoryData.icon,
                        keywords: `${specInfo.name} ${specInfo.usage} ${specInfo.description}`,
                        description: specInfo.description,
                        usage: specInfo.usage
                    };
                }
            }

            // 计算像素尺寸
            SIZE_CONFIG = {};
            Object.keys(SPECS_DATA).forEach(key => {
                const spec = SPECS_DATA[key];
                const w = Math.round(spec.w * 11.811);
                const h = Math.round(spec.h * 11.811);
                SIZE_CONFIG[key] = { w, h, ratio: w / h };
            });

            return true;
        } catch (error) {
            console.error('Failed to load specs:', error);
            // 回退到基本规格
            SPECS_DATA = {
                '1inch': { name: '一寸', w: 25, h: 35, category: '常用标准', categoryIcon: '📏', keywords: '一寸 常用' }
            };
            SIZE_CONFIG = {
                '1inch': { w: 295, h: 413, ratio: 295 / 413 }
            };
            return false;
        }
    }

    // DOM
    const elements = {
        fileInput: document.getElementById('fileInput'),
        uploadState: document.getElementById('uploadState'),
        editState: document.getElementById('editState'),
        cropImage: document.getElementById('cropImage'),
        previewCanvas: document.getElementById('previewCanvas'),
        downloadBtn: document.getElementById('downloadBtn'),
        downloadLayoutBtn: document.getElementById('downloadLayoutBtn'),
        loadingOverlay: document.getElementById('loadingOverlay'),
        loadingTitle: document.getElementById('loadingTitle'),
        loadingText: document.getElementById('loadingText'),
        loadingHint: document.getElementById('loadingHint'),
        beautifyCheck: document.getElementById('beautifyCheck'),
        specSearchInput: document.getElementById('specSearchInput'),
        specDropdown: document.getElementById('specDropdown')
    };

    // 动态加载提示
    let loadingInterval = null;
    const loadingSteps = [
        '正在智能抠图',
        '正在优化边缘',
        '正在美颜处理'
    ];

    function startLoadingAnimation() {
        let step = 0;
        loadingInterval = setInterval(() => {
            elements.loadingText.textContent = loadingSteps[step % loadingSteps.length] + '...';
            step++;
        }, 2500);
    }

    function stopLoadingAnimation() {
        if (loadingInterval) {
            clearInterval(loadingInterval);
            loadingInterval = null;
        }
    }

    // 初始化
    elements.fileInput.addEventListener('change', (e) => {
        if (e.target.files?.[0]) handleFile(e.target.files[0]);
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('#specSearchInput') && !e.target.closest('#specDropdown')) {
            hideSpecDropdown();
        }
    });

    document.addEventListener('DOMContentLoaded', async () => {
        // 加载规格数据
        await loadSpecs();
        // 构建下拉列表
        buildSpecDropdown();
        // 默认选择一寸
        selectSize('1inch');

        // 中文输入法支持
        let isComposing = false;

        elements.specSearchInput.addEventListener('compositionstart', () => {
            isComposing = true;
        });

        elements.specSearchInput.addEventListener('compositionend', (e) => {
            isComposing = false;
            // 输入法选词完成后才触发搜索
            filterSpecDropdown(e.target.value);
        });

        elements.specSearchInput.addEventListener('input', (e) => {
            // 如果不是在输入法组合中，立即触发搜索（支持英文、数字等）
            if (!isComposing) {
                filterSpecDropdown(e.target.value);
            }
        });

        elements.specSearchInput.addEventListener('focus', () => {
            showSpecDropdown();
        });
    });

    // 规格下拉
    function buildSpecDropdown() {
        if (!SPECS_DATA) return;

        const dropdown = elements.specDropdown;
        dropdown.innerHTML = '';

        const categories = {};
        Object.entries(SPECS_DATA).forEach(([key, spec]) => {
            if (!categories[spec.category]) categories[spec.category] = [];
            categories[spec.category].push({ key, ...spec });
        });

        Object.entries(categories).forEach(([category, specs]) => {
            const categoryDiv = document.createElement('div');
            categoryDiv.className = 'px-2 py-1.5';

            const categoryLabel = document.createElement('div');
            categoryLabel.className = 'text-xs text-gray-500 px-2 py-1 font-medium';
            // 添加图标
            const icon = specs[0]?.categoryIcon || '📋';
            categoryLabel.textContent = `${icon} ${category}`;
            categoryDiv.appendChild(categoryLabel);

            specs.forEach(spec => {
                const item = document.createElement('button');
                item.className = 'spec-item w-full text-left px-3 py-2 hover:bg-gray-100 rounded text-sm';
                item.setAttribute('data-key', spec.key);
                item.setAttribute('data-keywords', spec.keywords);
                item.onclick = () => {
                    selectSize(spec.key);
                    hideSpecDropdown();
                    elements.specSearchInput.value = '';
                };
                const px = SIZE_CONFIG[spec.key];
                item.innerHTML = `
                    <div class="font-medium text-gray-900">${spec.name}</div>
                    <div class="text-xs text-gray-500">${spec.w}×${spec.h}mm • ${px.w}×${px.h}px</div>
                `;
                categoryDiv.appendChild(item);
            });

            dropdown.appendChild(categoryDiv);
        });
    }

    function showSpecDropdown() {
        elements.specDropdown.classList.remove('hidden');
    }

    function hideSpecDropdown() {
        elements.specDropdown.classList.add('hidden');
    }

    function filterSpecDropdown(query) {
        const dropdown = elements.specDropdown;

        // 移除之前的"无结果"提示
        const existingNoResult = dropdown.querySelector('.no-results-message');
        if (existingNoResult) existingNoResult.remove();

        if (!query || query.trim() === '') {
            // 空查询显示全部
            const items = dropdown.querySelectorAll('.spec-item');
            items.forEach(item => item.style.display = 'block');
            // 显示所有分类
            const categories = dropdown.querySelectorAll('.px-2.py-1\\.5');
            categories.forEach(categoryDiv => categoryDiv.style.display = 'block');
            showSpecDropdown();
            return;
        }

        const items = dropdown.querySelectorAll('.spec-item');

        // 分词：将查询词按空格、标点等分割
        const queryTokens = query
            .split(/[\s,，、。；;]+/)
            .filter(t => t.length > 0);

        let matchedCount = 0;

        items.forEach(item => {
            const specKey = item.getAttribute('data-key');
            const spec = SPECS_DATA[specKey];
            if (!spec) {
                item.style.display = 'none';
                return;
            }

            // 构建多层次搜索空间
            const name = spec.name || '';
            const keywords = item.getAttribute('data-keywords') || '';
            const description = spec.description || '';
            const usage = spec.usage || '';

            // 检查是否所有查询词都匹配（AND逻辑）
            const allMatch = queryTokens.every(token => {
                const lowerToken = token.toLowerCase();
                const upperToken = token.toUpperCase();

                // 优先级1: 名称完全匹配（不区分大小写）
                if (name.toLowerCase() === lowerToken || name.toUpperCase() === upperToken) {
                    return true;
                }

                // 优先级2: 名称包含（不区分大小写）
                if (name.toLowerCase().includes(lowerToken)) {
                    return true;
                }

                // 优先级3: 名称大写形式匹配（如PMP匹配P）
                if (name.toUpperCase().includes(upperToken)) {
                    return true;
                }

                // 优先级4: 关键词、描述、用途包含
                const searchSpace = (keywords + ' ' + description + ' ' + usage).toLowerCase();
                return searchSpace.includes(lowerToken);
            });

            if (allMatch) {
                item.style.display = 'block';
                matchedCount++;
            } else {
                item.style.display = 'none';
            }
        });

        // 显示/隐藏分类标签（如果该分类下没有匹配项，隐藏分类标题）
        const categories = dropdown.querySelectorAll('.px-2.py-1\\.5');
        categories.forEach(categoryDiv => {
            const visibleItems = Array.from(categoryDiv.querySelectorAll('.spec-item'))
                .filter(item => item.style.display !== 'none');
            categoryDiv.style.display = visibleItems.length > 0 ? 'block' : 'none';
        });

        // 如果没有匹配结果，显示提示
        if (matchedCount === 0) {
            const noResultDiv = document.createElement('div');
            noResultDiv.className = 'no-results-message px-4 py-8 text-center text-gray-500 text-sm';
            noResultDiv.innerHTML = `
                <svg class="w-12 h-12 mx-auto mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <div>未找到"${query}"相关的证件照规格</div>
                <div class="text-xs mt-1">试试其他关键词，如"驾驶"、"护照"、"公务员"</div>
            `;
            dropdown.appendChild(noResultDiv);
        }

        showSpecDropdown();
    }

    function selectSize(sizeKey) {
        state.config.size = sizeKey;
        state.config.customWidth = null;
        state.config.customHeight = null;

        const spec = SPECS_DATA[sizeKey];
        const px = SIZE_CONFIG[sizeKey];
        document.getElementById('currentSpecName').textContent = spec.name;
        document.getElementById('currentSpecSize').textContent = `${spec.w}×${spec.h}mm • ${px.w}×${px.h}px`;

        if (state.cropper) {
            state.cropper.setAspectRatio(px.ratio);
        }

        updatePreview();
    }

    // 自定义规格
    function toggleCustomSpec() {
        const panel = document.getElementById('customSpecPanel');
        panel.classList.toggle('hidden');
    }

    function updateCustomPreview() {
        const width = parseInt(document.getElementById('customWidth').value);
        const height = parseInt(document.getElementById('customHeight').value);

        if (width && height) {
            const w = Math.round(width * 11.811);
            const h = Math.round(height * 11.811);
            document.getElementById('customPixelPreview').textContent = `像素尺寸：${w}×${h}px`;
        } else {
            document.getElementById('customPixelPreview').textContent = '像素尺寸：--';
        }
    }

    function applyCustomSpec() {
        const width = parseInt(document.getElementById('customWidth').value);
        const height = parseInt(document.getElementById('customHeight').value);

        if (!width || !height || width < 10 || height < 10 || width > 100 || height > 150) {
            alert('请输入有效尺寸（宽10-100mm，高10-150mm）');
            return;
        }

        state.config.customWidth = width;
        state.config.customHeight = height;
        state.config.size = 'custom';

        const w = Math.round(width * 11.811);
        const h = Math.round(height * 11.811);

        document.getElementById('currentSpecName').textContent = '自定义';
        document.getElementById('currentSpecSize').textContent = `${width}×${height}mm • ${w}×${h}px`;

        SIZE_CONFIG['custom'] = { w, h, ratio: w / h };

        if (state.cropper) {
            state.cropper.setAspectRatio(w / h);
        }

        toggleCustomSpec();
        updatePreview();
    }

    // 获取图片尺寸
    function getImageDimensions(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(img.src);
                resolve({ width: img.width, height: img.height });
            };
            img.onerror = () => reject(new Error('无法读取图片'));
            img.src = URL.createObjectURL(file);
        });
    }

    // 计算最优请求尺寸（始终返回原图或更大尺寸）
    function calculateOptimalSize(imgDim) {
        // 像素转毫米：px / 11.811
        const wMm = Math.round(imgDim.width / 11.811);
        const hMm = Math.round(imgDim.height / 11.811);

        // 直接返回原图尺寸，让后端返回完整分辨率的透明PNG
        return { w: wMm, h: hMm };
    }

    // 处理文件 - 立即抠图
    async function handleFile(file) {
        if (!file.type.startsWith('image/')) {
            alert('请上传图片文件');
            return;
        }

        if (file.size > 10 * 1024 * 1024) {
            alert('文件不能超过 10MB');
            return;
        }

        state.file = file;

        // 显示loading并启动动画
        elements.loadingOverlay.classList.remove('hidden');
        elements.uploadState.classList.add('hidden');

        try {
            // 1. 预加载图片获取原始尺寸
            elements.loadingTitle.textContent = 'AI 处理中';
            elements.loadingText.textContent = '正在分析图片...';
            elements.loadingHint.textContent = '';
            const imgDim = await getImageDimensions(file);

            console.log('原图尺寸:', imgDim.width, 'x', imgDim.height);

            // 2. 智能计算最优请求尺寸（避免放大）
            const requestSize = calculateOptimalSize(imgDim);

            console.log('请求尺寸:', requestSize.w, 'x', requestSize.h, 'mm');

            // 3. 检查是否需要提示用户
            if (imgDim.width < 1050 || imgDim.height < 1500) {
                console.warn('⚠️ 图片分辨率较低:', imgDim.width, 'x', imgDim.height);
                // 可选：显示提示
                // alert(`图片分辨率较低（${imgDim.width}×${imgDim.height}px）\n建议使用更高分辨率的照片以获得最佳效果`);
            }

            // 4. 调用后端API进行抠图
            elements.loadingTitle.textContent = 'AI 处理中';
            elements.loadingText.textContent = '正在智能抠图...';
            elements.loadingHint.textContent = '首次使用约需1-2分钟';

            // 启动动态提示
            startLoadingAnimation();

            const formData = new FormData();
            formData.append('file', file);
            formData.append('bg_color', 'transparent');
            formData.append('beautify', state.config.beautify);
            formData.append('custom_width_mm', requestSize.w.toString());
            formData.append('custom_height_mm', requestSize.h.toString());

            const response = await fetch('/api/media/image/id-photo', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error('抠图失败');
            }

            // 停止动画
            stopLoadingAnimation();

            // 显示完成状态
            elements.loadingTitle.textContent = '完成';
            elements.loadingText.textContent = '正在加载...';
            elements.loadingHint.textContent = '';

            // 获取透明PNG
            state.transparentImageBlob = await response.blob();

            // 显示编辑界面
            const reader = new FileReader();
            reader.onload = (e) => {
                elements.cropImage.src = e.target.result;
                elements.loadingOverlay.classList.add('hidden');
                elements.editState.classList.remove('hidden');
                elements.downloadBtn.disabled = false;
                elements.downloadLayoutBtn.disabled = false;
                initCropper();
            };
            reader.readAsDataURL(state.transparentImageBlob);

        } catch (error) {
            stopLoadingAnimation();
            alert('处理失败：' + error.message);
            elements.loadingOverlay.classList.add('hidden');
            elements.uploadState.classList.remove('hidden');
        }
    }

    // 初始化裁剪器
    function initCropper() {
        if (state.cropper) state.cropper.destroy();

        const ratio = state.config.size === 'custom' && SIZE_CONFIG['custom']
            ? SIZE_CONFIG['custom'].ratio
            : SIZE_CONFIG[state.config.size].ratio;

        state.cropper = new Cropper(elements.cropImage, {
            aspectRatio: ratio,
            viewMode: 1,
            dragMode: 'move',
            autoCropArea: 0.85,
            responsive: true,
            zoomOnWheel: true,
            checkOrientation: false,
            crop: updatePreview
        });
    }

    // 实时更新预览
    function updatePreview() {
        if (!state.cropper || !state.transparentImageBlob) return;

        const sizeConfig = state.config.size === 'custom' && SIZE_CONFIG['custom']
            ? SIZE_CONFIG['custom']
            : SIZE_CONFIG[state.config.size];

        // 获取裁剪后的Canvas（使用原始分辨率，不强制缩放）
        const sourceCanvas = state.cropper.getCroppedCanvas({
            imageSmoothingEnabled: true,
            imageSmoothingQuality: 'high'
        });

        if (!sourceCanvas) return;

        // === 预览Canvas（显示用）===
        const canvas = elements.previewCanvas;
        const dpr = window.devicePixelRatio || 1;

        // 计算显示尺寸
        const maxDisplayWidth = 400;
        let displayWidth = sizeConfig.w;
        let displayHeight = sizeConfig.h;

        if (displayWidth > maxDisplayWidth) {
            const scale = maxDisplayWidth / displayWidth;
            displayWidth = maxDisplayWidth;
            displayHeight = Math.round(sizeConfig.h * scale);
        }

        // Canvas物理尺寸 = 显示尺寸 × DPR
        canvas.width = displayWidth * dpr;
        canvas.height = displayHeight * dpr;
        canvas.style.width = displayWidth + 'px';
        canvas.style.height = displayHeight + 'px';

        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.scale(dpr, dpr);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.fillStyle = state.config.bgColor;
        ctx.fillRect(0, 0, displayWidth, displayHeight);
        ctx.drawImage(sourceCanvas, 0, 0, displayWidth, displayHeight);

        // === 下载Canvas（标准尺寸，从原始分辨率下采样）===
        const downloadCanvas = document.createElement('canvas');
        downloadCanvas.width = sizeConfig.w;
        downloadCanvas.height = sizeConfig.h;
        const downloadCtx = downloadCanvas.getContext('2d', { alpha: false });
        downloadCtx.imageSmoothingEnabled = true;
        downloadCtx.imageSmoothingQuality = 'high';
        downloadCtx.fillStyle = state.config.bgColor;
        downloadCtx.fillRect(0, 0, sizeConfig.w, sizeConfig.h);

        // 从原始分辨率缩小到标准尺寸（一步到位，避免多次重采样）
        downloadCtx.drawImage(sourceCanvas, 0, 0, sizeConfig.w, sizeConfig.h);

        state.downloadCanvas = downloadCanvas;
    }

    // 颜色选择
    function selectBgColor(color, btnElement) {
        state.config.bgColor = color;

        document.querySelectorAll('.color-btn').forEach(el => el.classList.remove('active'));
        if (btnElement) btnElement.classList.add('active');

        updatePreview();
    }

    function updateCustomColor(color) {
        state.config.bgColor = color;
        document.querySelectorAll('.color-btn').forEach(el => el.classList.remove('active'));
        updatePreview();
    }

    // 美颜变化 - 需要重新抠图
    function handleBeautifyChange() {
        const newValue = elements.beautifyCheck.checked;
        if (state.transparentImageBlob && newValue !== state.config.beautify) {
            if (confirm('修改美颜设置需要重新处理图片，是否继续？')) {
                state.config.beautify = newValue;
                // 重新处理
                handleFile(state.file);
            } else {
                // 恢复原值
                elements.beautifyCheck.checked = state.config.beautify;
            }
        } else {
            state.config.beautify = newValue;
        }
    }

    // 裁剪工具
    function rotateCrop(deg) {
        if (state.cropper) {
            state.cropper.rotate(deg);
            updatePreview();
        }
    }

    let scaleX = 1;
    function flipHorizontal() {
        if (state.cropper) {
            scaleX = -scaleX;
            state.cropper.scaleX(scaleX);
            updatePreview();
        }
    }

    function resetCrop() {
        if (state.cropper) {
            state.cropper.reset();
            updatePreview();
        }
    }

    function resetAll() {
        state.file = null;
        state.transparentImageBlob = null;
        state.downloadCanvas = null;
        if (state.cropper) {
            state.cropper.destroy();
            state.cropper = null;
        }
        elements.fileInput.value = '';

        elements.editState.classList.add('hidden');
        elements.uploadState.classList.remove('hidden');
        elements.downloadBtn.disabled = true;
        elements.downloadLayoutBtn.disabled = true;
    }

    // 下载 (使用后端高保真渲染)
    async function downloadResult() {
        if (!state.cropper || !state.transparentImageBlob) return;

        const sizeConfig = state.config.size === 'custom' && SIZE_CONFIG['custom']
            ? SIZE_CONFIG['custom']
            : SIZE_CONFIG[state.config.size];

        // 获取裁剪数据 (基于原图尺寸)
        const cropData = state.cropper.getData(true);

        // 显示加载中
        const originalText = elements.downloadBtn.textContent;
        elements.downloadBtn.textContent = '生成中...';
        elements.downloadBtn.disabled = true;

        try {
            const formData = new FormData();
            // 注意：这里发送的是已经抠图后的透明PNG
            formData.append('file', state.transparentImageBlob, 'processed.png');
            formData.append('crop_x', cropData.x);
            formData.append('crop_y', cropData.y);
            formData.append('crop_w', cropData.width);
            formData.append('crop_h', cropData.height);
            formData.append('rotate', cropData.rotate);
            formData.append('scale_x', cropData.scaleX);
            formData.append('scale_y', cropData.scaleY);
            formData.append('target_w', sizeConfig.w);
            formData.append('target_h', sizeConfig.h);
            formData.append('bg_color', state.config.bgColor);
            formData.append('dpi', 300);

            const response = await fetch('/api/media/image/id-photo/render', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('生成失败');

            const blob = await response.blob();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            const name = state.config.size === 'custom'
                ? `证件照_自定义_${Date.now()}.png`
                : `证件照_${SPECS_DATA[state.config.size].name}_${Date.now()}.png`;
            link.download = name;
            link.click();

        } catch (error) {
            console.error(error);
            alert('下载失败: ' + error.message);
        } finally {
            elements.downloadBtn.textContent = originalText;
            elements.downloadBtn.disabled = false;
        }
    }

    async function downloadLayout() {
        if (!state.cropper) return;

        const sizeConfig = state.config.size === 'custom' && SIZE_CONFIG['custom']
            ? SIZE_CONFIG['custom']
            : SIZE_CONFIG[state.config.size];

        const PAPER_W = 1205;
        const PAPER_H = 1795;
        const MARGIN = 30;
        const GAP = 30;

        const canvas = document.createElement('canvas');
        canvas.width = PAPER_W;
        canvas.height = PAPER_H;
        const ctx = canvas.getContext('2d', { alpha: false });

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, PAPER_W, PAPER_H);

        // 获取4倍分辨率裁剪
        const highResPhotoCanvas = state.cropper.getCroppedCanvas({
            width: sizeConfig.w * 4,
            height: sizeConfig.h * 4,
            imageSmoothingEnabled: true,
            imageSmoothingQuality: 'high'
        });

        // 标准尺寸，从4倍高质量下采样
        const photoWithBg = document.createElement('canvas');
        photoWithBg.width = sizeConfig.w;
        photoWithBg.height = sizeConfig.h;
        const photoCtx = photoWithBg.getContext('2d', { alpha: false });
        photoCtx.imageSmoothingEnabled = true;
        photoCtx.imageSmoothingQuality = 'high';
        photoCtx.fillStyle = state.config.bgColor;
        photoCtx.fillRect(0, 0, sizeConfig.w, sizeConfig.h);

        // 从4倍缩小到标准尺寸
        photoCtx.drawImage(highResPhotoCanvas, 0, 0, sizeConfig.w, sizeConfig.h);

        const imgW = sizeConfig.w;
        const imgH = sizeConfig.h;

        const cols = Math.floor((PAPER_W - MARGIN * 2 + GAP) / (imgW + GAP));
        const rows = Math.floor((PAPER_H - MARGIN * 2 + GAP) / (imgH + GAP));

        const gridW = cols * imgW + (cols - 1) * GAP;
        const gridH = rows * imgH + (rows - 1) * GAP;

        const startX = (PAPER_W - gridW) / 2;
        const startY = (PAPER_H - gridH) / 2;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = startX + c * (imgW + GAP);
                const y = startY + r * (imgH + GAP);
                ctx.drawImage(photoWithBg, x, y);
            }
        }

        canvas.toBlob((blob) => {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `证件照排版_6寸_${Date.now()}.png`;
            link.click();
        }, 'image/png');
    }
</script>
