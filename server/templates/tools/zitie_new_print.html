{% extends "base.html" %}

{% block title %}字帖预览（新版） - 在线工具{% endblock %}

{% block content %}
<div class="print:hidden max-w-5xl mx-auto mt-6">
  <div class="glass p-5 rounded-xl">
    <div class="flex items-start justify-between gap-3">
      <div>
        <h2 class="text-lg font-bold text-gray-900">字帖预览（新版）</h2>
        <p class="text-sm text-gray-600 mt-1">确认无误后点击“打印”，或用系统打印对话框导出 PDF。</p>
      </div>
      <div class="flex gap-2">
        <a href="/tools/zitie-new"
          class="px-4 py-2 bg-white/60 border border-white/50 rounded-md hover:bg-white text-sm">返回编辑</a>
        <button onclick="window.print()"
          class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 text-sm font-medium">打印</button>
      </div>
    </div>

    <div class="mt-3 text-xs text-gray-500">
      <span id="metaText"></span>
    </div>
  </div>
</div>

<div id="pagesRoot"
  class="w-full flex flex-col items-center gap-8 bg-gray-100 py-8 print:p-0 print:gap-0 print:bg-white">
</div>

<style>
  :root {
    --page-w: 210mm;
    --page-h: 297mm;
    --pad: 14mm;
    --header-h: 14mm;
    /* 参考市面字帖：外框线更粗、内部线更细更浅 */
    --grid-border-w: 0.55mm;
    --grid-inner-w: 0.20mm;
    --grid-diag-w: 0.20mm;
    --char-opacity: 0.16;
  }

  /* hide base chrome when printing */
  @media print {
    @page { size: A4; margin: 0; }
    header, footer, #bing-bg { display: none !important; }
    main { padding: 0 !important; max-width: none !important; }
    body { margin: 0; padding: 0; background: #fff !important; }
    .print\:hidden { display: none !important; }
  }

  .page {
    width: var(--page-w);
    height: var(--page-h);
    background: #fff;
    box-sizing: border-box;
    padding: var(--pad);
    position: relative;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  }

  @media print {
    .page {
      box-shadow: none !important;
      margin: 0 auto !important;
      page-break-after: always;
    }
  }

  .page-header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #111827;
    margin-bottom: 2mm;
  }

  .page-title {
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .page-fields {
    color: #374151;
    white-space: nowrap;
  }

  .sheet {
    /* 尺寸由 JS 按 cols/rows 精确设置，避免线条叠加导致粗细不一致 */
    height: calc(var(--page-h) - var(--pad) * 2 - var(--header-h) - 2mm);
    display: grid;
    gap: 0;
    align-content: start;
    justify-content: center;
    margin: 0 auto;
    background-repeat: repeat;
  }

  /* 网格外框与分隔线：统一在 sheet 上绘制（避免相邻 cell 边框叠加） */
  .sheet[data-grid="none"] {
    box-shadow: none;
    background-image: none;
  }

  .sheet:not([data-grid="none"]) {
    /* 用 inset 阴影画外框，避免与内部网格线在边缘“叠成双线”导致右边/上边显得更粗 */
    box-shadow: inset 0 0 0 var(--grid-border-w) var(--grid-color);
    background-color: #fff;
    background-image:
      /* vertical split lines */
      repeating-linear-gradient(to right,
        transparent 0 calc(var(--cell-mm) * 1mm - var(--grid-border-w)),
        var(--grid-color) calc(var(--cell-mm) * 1mm - var(--grid-border-w)) calc(var(--cell-mm) * 1mm)
      ),
      /* horizontal split lines */
      repeating-linear-gradient(to bottom,
        transparent 0 calc(var(--cell-mm) * 1mm - var(--grid-border-w)),
        var(--grid-color) calc(var(--cell-mm) * 1mm - var(--grid-border-w)) calc(var(--cell-mm) * 1mm)
      );
  }

  .row {
    display: flex;
    justify-content: center;
    gap: 0;
  }

  .cell {
    width: calc(var(--cell-mm) * 1mm);
    height: calc(var(--cell-mm) * 1mm);
    box-sizing: border-box;
    /* 外框/分隔线由 sheet 绘制，这里不再画 border，避免粗细不一致 */
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    /* 透明，避免遮住 sheet 背景里的格子边界线 */
    background-color: transparent;
  }

  .cell[data-grid="none"] {
    background-image: none !important;
  }

  .cell[data-grid="none"]::before {
    content: none !important;
  }

  .char {
    font-size: calc(var(--cell-mm) * 0.68mm);
    line-height: 1;
    color: var(--char-color);
    opacity: var(--char-opacity);
    user-select: none;
  }

  /* fonts */
  .font-kaiti { font-family: "KaiTi", "Kaiti SC", "STKaiti", serif; }
  .font-songti { font-family: "SimSun", "Songti SC", "STSong", serif; }
  .font-heiti { font-family: "SimHei", "Heiti SC", "STHeiti", sans-serif; }

  /* grid backgrounds */
  .cell[data-grid="square"] { background-image: none; }

  .cell[data-grid="tian"] {
    background-image:
      linear-gradient(90deg,
        transparent calc(50% - var(--grid-inner-w) / 2),
        var(--grid-soft-color) calc(50% - var(--grid-inner-w) / 2),
        var(--grid-soft-color) calc(50% + var(--grid-inner-w) / 2),
        transparent calc(50% + var(--grid-inner-w) / 2)
      ),
      linear-gradient(0deg,
        transparent calc(50% - var(--grid-inner-w) / 2),
        var(--grid-soft-color) calc(50% - var(--grid-inner-w) / 2),
        var(--grid-soft-color) calc(50% + var(--grid-inner-w) / 2),
        transparent calc(50% + var(--grid-inner-w) / 2)
      );
    background-size: 100% 100%;
  }

  .cell[data-grid="mizi"] {
    background-image:
      linear-gradient(90deg,
        transparent calc(50% - var(--grid-inner-w) / 2),
        var(--grid-soft-color) calc(50% - var(--grid-inner-w) / 2),
        var(--grid-soft-color) calc(50% + var(--grid-inner-w) / 2),
        transparent calc(50% + var(--grid-inner-w) / 2)
      ),
      linear-gradient(0deg,
        transparent calc(50% - var(--grid-inner-w) / 2),
        var(--grid-soft-color) calc(50% - var(--grid-inner-w) / 2),
        var(--grid-soft-color) calc(50% + var(--grid-inner-w) / 2),
        transparent calc(50% + var(--grid-inner-w) / 2)
      ),
      linear-gradient(45deg,
        transparent calc(50% - var(--grid-diag-w) / 2),
        var(--grid-soft-color) calc(50% - var(--grid-diag-w) / 2),
        var(--grid-soft-color) calc(50% + var(--grid-diag-w) / 2),
        transparent calc(50% + var(--grid-diag-w) / 2)
      ),
      linear-gradient(-45deg,
        transparent calc(50% - var(--grid-diag-w) / 2),
        var(--grid-soft-color) calc(50% - var(--grid-diag-w) / 2),
        var(--grid-soft-color) calc(50% + var(--grid-diag-w) / 2),
        transparent calc(50% + var(--grid-diag-w) / 2)
      );
    background-size: 100% 100%;
  }

  .cell[data-grid="huigong"]::before {
    content: "";
    position: absolute;
    inset: 25%;
    border: var(--grid-inner-w) dashed var(--grid-soft-color);
    pointer-events: none;
  }

  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
</style>

<script>
  // 市面常见标准字帖：固定格宽（可根据你的实际打印效果再微调）
  const STANDARD_CELL_MM = 20;
  // 格线固定红色（不可选择）
  const STANDARD_GRID_COLOR = '#ef4444';
  const GRID_INNER_ALPHA = 0.22; // 内线更浅
  const GRID_BORDER_ALPHA = 0.75; // 外框更深

  function getParam(name, fallback = '') {
    const v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === undefined) ? fallback : v;
  }

  function sanitizeChars(text) {
    // 仅过滤空白；保留标点以便练习句子
    return (text || '').split('').filter(c => c && c.trim().length > 0);
  }

  function calcColsRows(cellMM, padMM, headerMM) {
    const pageW = 210, pageH = 297;
    const contentW = pageW - padMM * 2;
    const contentH = pageH - padMM * 2 - headerMM - 2; // 2mm header gap
    const cols = Math.max(1, Math.floor(contentW / cellMM));
    const rows = Math.max(1, Math.floor(contentH / cellMM));
    return { cols, rows, contentW, contentH };
  }

  function makePageRoot(opts) {
    const page = document.createElement('div');
    page.className = 'page';
    page.style.setProperty('--cell-mm', String(opts.cellMM));
    page.style.setProperty('--grid-color', opts.gridColor);
    page.style.setProperty('--grid-soft-color', opts.gridSoftColor || hexToRgba(opts.gridColor, 0.22));
    page.style.setProperty('--char-color', opts.charColor);
    page.style.setProperty('--char-opacity', String(opts.mode === 'trace' ? 0.12 : 0.16));

    const header = document.createElement('div');
    header.className = 'page-header';
    header.innerHTML = `
      <div class="page-title">字帖练习</div>
      <div class="page-fields">姓名：__________　日期：____年__月__日</div>
    `;

    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.dataset.grid = opts.grid;
    sheet.style.gridTemplateColumns = `repeat(${opts.cols}, calc(${opts.cellMM} * 1mm))`;
    sheet.style.width = (opts.cols * opts.cellMM) + 'mm';
    sheet.style.height = (opts.rows * opts.cellMM) + 'mm';

    page.appendChild(header);
    page.appendChild(sheet);
    return { page, sheet };
  }

  function hexToRgba(hex, alpha) {
    const h = (hex || '').replace('#', '').trim();
    if (h.length !== 6) return `rgba(16,185,129,${alpha})`;
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function makeCell(opts, chOrEmpty) {
    const cell = document.createElement('div');
    cell.className = `cell font-${opts.font}`;
    cell.dataset.grid = opts.grid;
    if (opts.grid === 'none') cell.dataset.grid = 'none';

    if (chOrEmpty) {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = chOrEmpty;
      cell.appendChild(span);
    }
    return cell;
  }

  function renderRowLayout(opts, chars) {
    const root = document.getElementById('pagesRoot');
    root.innerHTML = '';

    // 每个字占一行；行内是 cols 个格子
    const perPageRows = opts.rows;
    let rowIndex = 0;
    let pageBundle = makePageRoot(opts);
    root.appendChild(pageBundle.page);

    for (let i = 0; i < chars.length; i++) {
      if (rowIndex >= perPageRows) {
        pageBundle = makePageRoot(opts);
        root.appendChild(pageBundle.page);
        rowIndex = 0;
      }

      const ch = chars[i];
      for (let c = 0; c < opts.cols; c++) {
        const show = (opts.mode === 'trace') ? ch : (c === 0 ? ch : '');
        pageBundle.sheet.appendChild(makeCell(opts, show));
      }
      rowIndex += 1;
    }

    // 如果最后一页没铺满行，补空白行（保持版面统一）
    while (rowIndex < perPageRows) {
      for (let c = 0; c < opts.cols; c++) {
        pageBundle.sheet.appendChild(makeCell(opts, ''));
      }
      rowIndex += 1;
    }
  }

  function renderPageLayout(opts, chars) {
    const root = document.getElementById('pagesRoot');
    root.innerHTML = '';

    const cellsPerPage = opts.cols * opts.rows;
    const repeatFill = opts.repeatFill;

    let idx = 0;
    let pageIndex = 0;

    // 至少生成 1 页
    while (true) {
      const pageBundle = makePageRoot(opts);
      root.appendChild(pageBundle.page);

      for (let i = 0; i < cellsPerPage; i++) {
        let ch = '';
        if (chars.length > 0) {
          // 先按顺序输出一次；若需要铺满，则在最后一页剩余格子里循环填充
          if (idx < chars.length) {
            ch = chars[idx];
          } else if (repeatFill) {
            ch = chars[idx % chars.length];
          } else {
            ch = '';
          }
        }

        // 临摹：仅在有字的格子里显示参考字；描红：同样如此，但透明度更低（在变量里控制）
        pageBundle.sheet.appendChild(makeCell(opts, ch));
        idx += 1;
      }

      pageIndex += 1;
      // 不循环：用完即止（最后一页剩余格子会是空白）
      if (!repeatFill && idx >= chars.length) break;

      // 循环铺满：至少覆盖一遍所有字符；若字符很多则继续翻页直到覆盖完
      if (repeatFill && chars.length === 0) break;
      if (repeatFill && idx >= chars.length) break;

      // 上限保护：避免生成太多页导致浏览器卡死
      if (pageIndex >= 20) break;
    }
  }

  function render() {
    const text = getParam('text', '');
    const layout = getParam('layout', 'page');
    const grid = getParam('grid', 'mizi');
    const font = getParam('font', 'kaiti');
    const charColor = getParam('charColor', '#9CA3AF');
    const mode = getParam('mode', 'copy'); // copy | trace
    const repeatFill = getParam('repeatFill', '1') === '1';
    const autoPrint = getParam('autoPrint', '0') === '1';

    const chars = sanitizeChars(text);

    const cellMM = STANDARD_CELL_MM;
    const gridColor = hexToRgba(STANDARD_GRID_COLOR, GRID_BORDER_ALPHA);
    const gridSoftColor = hexToRgba(STANDARD_GRID_COLOR, GRID_INNER_ALPHA);

    const pad = 14;
    const header = 14;
    const { cols, rows } = calcColsRows(cellMM, pad, header);

    const opts = {
      layout,
      grid,
      font,
      charColor,
      gridColor,
      cellMM,
      cols,
      rows,
      mode,
      repeatFill,
      gridSoftColor,
    };

    const meta = document.getElementById('metaText');
    if (meta) {
      meta.textContent = `模板：${layout === 'row' ? '单字行练' : '整页通练'} ｜ 格子：${grid} ｜ 格宽：${cellMM}mm ｜ 格线：固定红色 ｜ 列×行：${cols}×${rows} ｜ 字符数：${chars.length}`;
    }

    if (layout === 'row') renderRowLayout(opts, chars.length ? chars : ['字']);
    else renderPageLayout(opts, chars);

    if (autoPrint) {
      setTimeout(() => window.print(), 200);
    }
  }

  render();
</script>
{% endblock %}
