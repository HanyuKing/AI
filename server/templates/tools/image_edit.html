{% extends "base.html" %}

{% block title %}图片编辑 - MediaToolbox{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto mt-10">
    <div class="bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="border-b border-gray-200 px-6 py-4">
            <h2 class="text-xl font-bold text-gray-800">图片编辑器</h2>
            <p class="text-sm text-gray-500 mt-1">旋转、缩放、压缩一站式处理</p>
        </div>

        <div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Controls Panel -->
            <div class="lg:col-span-1 space-y-8 overflow-y-auto max-h-[80vh] pr-2">
                
                <!-- 1. File Input -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <label class="block text-sm font-medium text-gray-700 mb-2">1. 选择图片</label>
                    <input type="file" id="fileInput" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-primary file:text-white hover:file:bg-blue-600 transition-colors cursor-pointer"/>
                </div>

                <!-- 2. Rotate -->
                <div id="rotate-controls" class="border-t border-gray-100 pt-6">
                    <h3 class="text-md font-semibold text-gray-900 mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        2. 旋转
                    </h3>
                    <div class="space-y-4">
                        <div class="flex items-center space-x-2">
                            <button type="button" onclick="stepRotate(-90)" class="flex-1 px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                                <span class="inline-block transform -scale-x-100">⟳</span> 向左 90°
                            </button>
                            <button type="button" onclick="stepRotate(90)" class="flex-1 px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                                ⟳ 向右 90°
                            </button>
                        </div>
                        <div>
                            <div class="flex justify-between mb-1">
                                <label class="text-xs text-gray-500">微调角度</label>
                                <span class="text-xs text-gray-700 font-medium"><span id="angleDisplay">0</span>°</span>
                            </div>
                            <input type="range" id="customAngle" min="-180" max="180" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary" oninput="handleAngleInput(this.value)">
                        </div>
                    </div>
                </div>

                <!-- 3. Resize -->
                <div id="resize-controls" class="border-t border-gray-100 pt-6">
                    <h3 class="text-md font-semibold text-gray-900 mb-4 flex items-center">
                         <svg class="w-5 h-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                        3. 缩放
                    </h3>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">宽度 (px)</label>
                                <input type="number" id="resizeWidth" class="block w-full sm:text-sm border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary" oninput="handleDimensionInput('width', this.value)">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">高度 (px)</label>
                                <input type="number" id="resizeHeight" class="block w-full sm:text-sm border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary" oninput="handleDimensionInput('height', this.value)">
                            </div>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="lockAspect" checked class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                            <label for="lockAspect" class="ml-2 block text-sm text-gray-600">锁定长宽比</label>
                        </div>
                        <div class="flex space-x-2">
                             <button onclick="setResizeRatio(0.25)" class="flex-1 px-2 py-1 text-xs border border-gray-200 bg-gray-50 hover:bg-gray-100 rounded text-gray-600 transition-colors">25%</button>
                             <button onclick="setResizeRatio(0.5)" class="flex-1 px-2 py-1 text-xs border border-gray-200 bg-gray-50 hover:bg-gray-100 rounded text-gray-600 transition-colors">50%</button>
                             <button onclick="setResizeRatio(0.75)" class="flex-1 px-2 py-1 text-xs border border-gray-200 bg-gray-50 hover:bg-gray-100 rounded text-gray-600 transition-colors">75%</button>
                             <button onclick="setResizeRatio(1.0)" class="flex-1 px-2 py-1 text-xs border border-gray-200 bg-gray-50 hover:bg-gray-100 rounded text-gray-600 transition-colors">100%</button>
                        </div>
                    </div>
                </div>

                <!-- 4. Compress & Output -->
                <div id="compress-controls" class="border-t border-gray-100 pt-6">
                    <h3 class="text-md font-semibold text-gray-900 mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                        4. 导出设置
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">输出格式</label>
                            <select id="outputFormat" onchange="handleFormatInput(this.value)" class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm rounded-md shadow-sm">
                                <option value="image/jpeg">JPEG (推荐)</option>
                                <option value="image/webp">WEBP (高压缩率)</option>
                                <option value="image/png">PNG (无损)</option>
                            </select>
                            <p id="pngWarning" class="text-xs text-amber-600 mt-1 hidden bg-amber-50 p-2 rounded border border-amber-100">
                                <span class="font-bold">提示：</span> PNG 不支持质量压缩，仅支持无损缩放。
                            </p>
                        </div>
                        
                        <div id="qualityControl">
                            <div class="flex justify-between mb-1">
                                <label class="text-xs text-gray-500">画质/压缩率</label>
                                <span class="text-xs text-gray-700 font-medium"><span id="qualityDisplay">92</span>%</span>
                            </div>
                            <input type="range" id="qualityRange" min="1" max="100" value="92" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-secondary" oninput="handleQualityInput(this.value)">
                        </div>

                        <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 space-y-2">
                            <div class="flex justify-between text-sm border-b border-blue-200 pb-2">
                                <span class="text-blue-600">原始大小</span>
                                <span class="font-medium text-blue-800" id="originalSize">-- KB</span>
                            </div>
                            <div class="flex justify-between text-sm items-center pt-1">
                                <span class="text-blue-600">预计大小</span>
                                <span class="font-bold text-blue-800 text-lg" id="compressedSize">-- KB</span>
                            </div>
                        </div>

                        <button id="downloadBtn" disabled onclick="downloadImage()" class="w-full flex justify-center items-center px-4 py-3 border border-transparent rounded-md shadow-sm text-base font-medium text-white bg-gray-400 cursor-not-allowed hover:bg-gray-500 transition-all duration-200 transform active:scale-[0.98]">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            下载处理后的图片
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Preview Panel -->
            <div class="lg:col-span-2 bg-gray-50 rounded-xl border border-gray-200 flex flex-col h-[80vh] sticky top-4">
                <div class="flex-1 overflow-auto flex items-center justify-center p-4 relative custom-scrollbar" style="background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 20px 20px;">
                    <p id="previewPlaceholder" class="text-gray-400 text-sm flex flex-col items-center">
                        <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        请在左侧上传图片
                    </p>
                    <img id="previewImage" class="max-w-none shadow-lg hidden transition-all duration-200" style="max-height: 100%; max-width: 100%; object-fit: contain;" />
                </div>
                <div class="bg-white border-t border-gray-200 px-4 py-2 flex justify-between items-center text-xs text-gray-500 rounded-b-xl">
                    <span id="imageInfo">Ready</span>
                    <span>预览模式</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // State
    let originalImage = new Image();
    let originalFileName = 'image.png';
    let originalFileSize = 0;
    
    // Transformation State
    let state = {
        angle: 0,      // Degrees
        scale: 1.0,    // Relative to the rotated bounding box
        quality: 0.92, // 0.0 - 1.0
        format: 'image/jpeg' 
    };
    
    let rotatedBaseDims = { w: 0, h: 0 };

    // Elements
    const fileInput = document.getElementById('fileInput');
    const previewImg = document.getElementById('previewImage');
    const placeholder = document.getElementById('previewPlaceholder');
    const downloadBtn = document.getElementById('downloadBtn');
    const imageInfo = document.getElementById('imageInfo');
    
    const customAngleInput = document.getElementById('customAngle');
    const angleDisplay = document.getElementById('angleDisplay');
    
    const widthInput = document.getElementById('resizeWidth');
    const heightInput = document.getElementById('resizeHeight');
    const lockAspect = document.getElementById('lockAspect');
    
    const qualityRange = document.getElementById('qualityRange');
    const qualityDisplay = document.getElementById('qualityDisplay');
    const outputFormat = document.getElementById('outputFormat');
    const qualityControl = document.getElementById('qualityControl');

    // 1. Load Image
    fileInput.addEventListener('change', function(e) {
        if (this.files && this.files[0]) {
            const file = this.files[0];
            originalFileName = file.name;
            originalFileSize = file.size;
            
            document.getElementById('originalSize').textContent = formatBytes(originalFileSize);
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                originalImage = new Image();
                originalImage.onload = function() {
                    // Reset State
                    state.angle = 0;
                    state.scale = 1.0;
                    state.quality = 0.92;
                    state.format = 'image/jpeg'; // Default recommendation
                    
                    // Reset UI
                    customAngleInput.value = 0;
                    angleDisplay.textContent = "0";
                    widthInput.value = originalImage.width;
                    heightInput.value = originalImage.height;
                    qualityRange.value = 92;
                    qualityDisplay.textContent = "92";
                    outputFormat.value = 'image/jpeg';
                    
                    rotatedBaseDims = { w: originalImage.width, h: originalImage.height };
                    
                    render();
                    enableDownload();
                };
                originalImage.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // 2. Core Render Function
    function render() {
        if (!originalImage.src) return;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // A. Calculate Bounding Box
        const rads = state.angle * Math.PI / 180;
        const c = Math.cos(rads);
        const s = Math.sin(rads);
        
        const baseW = Math.abs(originalImage.width * c) + Math.abs(originalImage.height * s);
        const baseH = Math.abs(originalImage.width * s) + Math.abs(originalImage.height * c);
        
        rotatedBaseDims = { w: baseW, h: baseH };
        
        // B. Apply Scale
        const targetW = Math.round(baseW * state.scale);
        const targetH = Math.round(baseH * state.scale);
        
        canvas.width = targetW;
        canvas.height = targetH;
        
        // C. Draw
        if (state.format === 'image/jpeg') {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        ctx.translate(targetW/2, targetH/2);
        ctx.scale(state.scale, state.scale);
        ctx.rotate(rads);
        ctx.drawImage(originalImage, -originalImage.width/2, -originalImage.height/2);
        
        // D. Update Output & UI
        if (state.format === 'image/png') {
            document.getElementById('pngWarning').classList.remove('hidden');
            qualityControl.classList.add('opacity-50', 'pointer-events-none');
        } else {
            document.getElementById('pngWarning').classList.add('hidden');
            qualityControl.classList.remove('opacity-50', 'pointer-events-none');
        }

        const dataUrl = canvas.toDataURL(state.format, state.quality);
        previewImg.src = dataUrl;
        previewImg.classList.remove('hidden');
        placeholder.classList.add('hidden');
        
        const head = 'data:' + state.format + ';base64,';
        const sizeBytes = Math.round((dataUrl.length - head.length) * 3 / 4);
        document.getElementById('compressedSize').textContent = formatBytes(sizeBytes);
        
        imageInfo.textContent = `${targetW} x ${targetH} px | ${state.format.split('/')[1].toUpperCase()}`;
        
        if (document.activeElement !== widthInput) widthInput.value = targetW;
        if (document.activeElement !== heightInput) heightInput.value = targetH;
    }

    // 3. Input Handlers
    function handleAngleInput(val) {
        state.angle = parseInt(val);
        angleDisplay.textContent = state.angle;
        render();
    }

    function stepRotate(delta) {
        let newVal = parseInt(customAngleInput.value) + delta;
        if (newVal > 180) newVal -= 360;
        if (newVal < -180) newVal += 360;
        customAngleInput.value = newVal;
        handleAngleInput(newVal);
    }

    function handleDimensionInput(type, val) {
        if (!originalImage.src) return;
        const numVal = parseInt(val);
        if (isNaN(numVal) || numVal <= 0) return;
        
        if (type === 'width') {
            state.scale = numVal / rotatedBaseDims.w;
            if (lockAspect.checked) {
                heightInput.value = Math.round(rotatedBaseDims.h * state.scale);
            }
        } else {
            state.scale = numVal / rotatedBaseDims.h;
            if (lockAspect.checked) {
                widthInput.value = Math.round(rotatedBaseDims.w * state.scale);
            }
        }
        render();
    }

    function setResizeRatio(ratio) {
        state.scale = ratio;
        render();
    }
    
    function handleQualityInput(val) {
        state.quality = parseInt(val) / 100;
        qualityDisplay.textContent = val;
        render();
    }
    
    function handleFormatInput(val) {
        state.format = val;
        render();
    }

    // 4. Download
    function enableDownload() {
        downloadBtn.disabled = false;
        downloadBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
        downloadBtn.classList.add('bg-green-600', 'hover:bg-green-700');
        downloadBtn.classList.add('bg-primary', 'hover:bg-blue-700'); 
        // Remove old classes first to be clean, but simply adding primary helps
        downloadBtn.className = "w-full flex justify-center items-center px-4 py-3 border border-transparent rounded-md shadow-sm text-base font-medium text-white bg-primary hover:bg-blue-700 transition-all duration-200 transform active:scale-[0.98]";
    }

    function downloadImage() {
        const link = document.createElement('a');
        let ext = 'jpg';
        if (state.format === 'image/png') ext = 'png';
        else if (state.format === 'image/webp') ext = 'webp';
        
        const parts = originalFileName.split('.');
        if (parts.length > 1) parts.pop();
        const name = parts.join('.');
        
        link.download = `${name}_edited.${ext}`;
        link.href = previewImg.src;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    function formatBytes(bytes, decimals = 2) {
        if (!+bytes) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }
</script>
{% endblock %}
