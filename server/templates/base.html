<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MediaToolbox{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        dark: '#1F2937',
                    }
                }
            }
        }
    </script>
    <style>
        .tool-card:hover {
            transform: translateY(-5px);
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="window.location.href='/'">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-8 w-8">
                        <defs>
                            <linearGradient id="gradBlueHeader" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="gradCyanHeader" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <path d="M12 2l8.5 5v10L12 22l-8.5-5V7L12 2z" stroke="url(#gradBlueHeader)" stroke-width="2" fill="none" />
                        <path d="M12 22v-8" stroke="url(#gradBlueHeader)" stroke-width="2" />
                        <path d="M12 14l-8.5-5" stroke="url(#gradBlueHeader)" stroke-width="2" />
                        <path d="M12 14l8.5-5" stroke="url(#gradBlueHeader)" stroke-width="2" />
                        <path d="M12 10l3-1.5-3-1.5-3 1.5z" fill="url(#gradCyanHeader)" stroke="none"/>
                        <path d="M12 10l3-1.5-3-1.5-3 1.5z" fill="#22D3EE" filter="blur(2px)" opacity="0.5"/>
                    </svg>
                    <span class="ml-2 text-xl font-bold text-gray-900">MediaToolbox</span>
                </div>
                <nav class="flex space-x-4 items-center">
                    <a href="/" class="text-gray-500 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">首页</a>
                    <a href="/feedback" class="text-gray-500 hover:text-primary px-3 py-2 rounded-md text-sm font-medium flex items-center transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg>
                        意见反馈
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-500 text-sm">
                © 2023 MediaToolbox. All rights reserved.
            </p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
