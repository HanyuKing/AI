<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <title>{% block title %}在线工具 - Free Online Tools / 免费在线工具箱{% endblock %}</title>
    <meta name="description"
        content="{% block description %}在线工具 provides free online tools including ID photo maker, PDF compressor, image converter, and QR code generator. No download required, privacy protected. / 在线工具 提供免费在线证件照制作、PDF压缩、格式转换、二维码生成等实用工具。无需下载，保护隐私，高效便捷。{% endblock %}">
    <meta name="keywords"
        content="{% block keywords %}online tools, id photo maker, pdf compressor, image converter, qr code generator, free tools, 在线工具, 证件照制作, PDF压缩, 图片转换, 二维码生成, 免费工具箱, 在线工具{% endblock %}">
    <meta name="author" content="在线工具 Team">
    <meta name="robots" content="index, follow">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://mediatoolbox.com{{ request.url.path }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mediatoolbox.com{{ request.url.path }}">
    <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ self.description() }}{% endblock %}">
    <meta property="og:image" content="https://mediatoolbox.com/static/icon.png">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:locale:alternate" content="en_US">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://mediatoolbox.com{{ request.url.path }}">
    <meta property="twitter:title" content="{% block twitter_title %}{{ self.title() }}{% endblock %}">
    <meta property="twitter:description"
        content="{% block twitter_description %}{{ self.description() }}{% endblock %}">
    <meta property="twitter:image" content="https://mediatoolbox.com/static/icon.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/icon.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        dark: '#1F2937',
                    }
                }
            }
        }
    </script>

    <!-- Structured Data (WebSite) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "在线工具",
      "alternateName": ["在线工具 Online Tools", "在线工具箱"],
      "url": "https://mediatoolbox.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://mediatoolbox.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    {% block structured_data %}{% endblock %}

    <style>
        /* Glassmorphism Utilities */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1rem;
            /* 16px - rounded-2xl */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .glass-hover {
            transition: all 0.3s ease;
        }

        .glass-hover:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* Bing Wallpaper Background */
        #bing-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 0.5s ease-in-out;
        }

        .tool-card:hover {
            transform: translateY(-5px);
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body class="text-gray-800 font-sans min-h-screen flex flex-col">
    <!-- Background Image Container -->
    <div id="bing-bg" class="bg-gray-50"></div>

    <!-- Header -->
    <header class="glass sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="window.location.href='/'">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="h-8 w-8">
                        <defs>
                            <linearGradient id="gradBlueHeader" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="gradCyanHeader" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <path d="M12 2l8.5 5v10L12 22l-8.5-5V7L12 2z" stroke="url(#gradBlueHeader)" stroke-width="2"
                            fill="none" />
                        <path d="M12 22v-8" stroke="url(#gradBlueHeader)" stroke-width="2" />
                        <path d="M12 14l-8.5-5" stroke="url(#gradBlueHeader)" stroke-width="2" />
                        <path d="M12 14l8.5-5" stroke="url(#gradBlueHeader)" stroke-width="2" />
                        <path d="M12 10l3-1.5-3-1.5-3 1.5z" fill="url(#gradCyanHeader)" stroke="none" />
                        <path d="M12 10l3-1.5-3-1.5-3 1.5z" fill="#22D3EE" filter="blur(2px)" opacity="0.5" />
                    </svg>
                    <span class="ml-2 text-xl font-bold text-gray-900">在线工具</span>
                </div>
                <nav class="flex space-x-4 items-center">
                    <a href="/"
                        class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium hover:bg-white/50 transition-colors">首页</a>
                    <a href="/feedback"
                        class="text-gray-600 hover:text-primary px-3 py-2 rounded-md text-sm font-medium flex items-center transition-colors hover:bg-white/50">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z">
                            </path>
                        </svg>
                        意见反馈
                    </a>
                    <!-- Bing壁纸下载功能已禁用 -->
                    <!--
                    <button onclick="downloadWallpaper()" title="下载今日必应壁纸"
                        class="text-gray-600 hover:text-primary px-3 py-2 rounded-md text-sm font-medium flex items-center transition-colors hover:bg-white/50">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        下载背景
                    </button>
                    -->
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full relative z-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="glass border-t border-gray-200 mt-auto relative z-10">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-600 text-sm">
                © 2023 在线工具. All rights reserved.
                <span id="bg-copyright" class="ml-2 text-xs text-gray-400 block sm:inline mt-1 sm:mt-0"></span>
            </p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>

</html>
